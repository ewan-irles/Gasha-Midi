<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3d20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gacha'Midi">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Gacha'Midi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
<style>
/* VOICE: gacha de cour de récré, punchy, fun mais lisible en 2 secondes à midi.
   IDEA: un booster de cartes à collectionner, version cantine.
   PICTURE: carrousel de cartes à en-tête noir + booster qui se déchire, cartes qui se retournent.
   COLOUR and TYPE: vert néon #35d16b sur vert forêt (sombre) ou menthe (clair), orange photo pour le booster; rangs bleu/violet/or. Outfit + Big Shoulders pour le logo.
   LAYOUT: colonne mobile 480px, carrousel centré, gros bouton contour, anneaux de pity, tab bar noire. */
:root{--bg1:#e4f3e8;--bg2:#f7fbf8;--ink:#0b1a10;--mut:#56685b;--card:#fff;--card2:#eef4ef;--line:#d3e2d6;--g:#35d16b;--gInk:#13843b;--onG:#06140a;--nav:#fff;--ov1:#ffffff;--ov2:#cdeAd5;--ovInk:#0b1a10;--ovRow:#ffffff;color-scheme:light}
:root[data-theme=dark]{--bg1:#0f3d20;--bg2:#040a06;--ink:#f2f7f3;--mut:#9db6a5;--card:#0a130d;--card2:#13221a;--line:#1f3527;--gInk:#3ad46f;--nav:#000;--ov1:#174428;--ov2:#020604;--ovInk:#fff;--ovRow:rgba(255,255,255,.07);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#0f3d20;--bg2:#040a06;--ink:#f2f7f3;--mut:#9db6a5;--card:#0a130d;--card2:#13221a;--line:#1f3527;--gInk:#3ad46f;--nav:#000;--ov1:#174428;--ov2:#020604;--ovInk:#fff;--ovRow:rgba(255,255,255,.07);color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:linear-gradient(180deg,var(--bg1),var(--bg2) 75%) fixed;color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:480px;margin:0 auto;padding:14px 16px 120px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.mini{font:900 22px/0.9 'Big Shoulders Display',Impact,sans-serif;color:var(--gInk)}
.me{display:grid;justify-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:0}
.av{width:66px;height:66px;border-radius:50%;border:3px solid var(--g);display:grid;place-items:center;font-size:32px;overflow:hidden;background:var(--card2)}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:72px;height:72px;flex:none}
.me small{font:700 13px Outfit,system-ui,sans-serif}
.tb{display:flex;gap:12px;justify-content:flex-end}
.cb{width:52px;height:52px;border-radius:50%;background:var(--g);color:var(--onG);display:grid;place-items:center;border:0;cursor:pointer;transition:transform .15s}
.cb:active{transform:scale(.92)}
.car{position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:22px 13%;margin:0 -16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.bc{flex:0 0 74%;scroll-snap-align:center;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:3/4.25;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(0,0,0,.3);color:#fff;border:0;padding:0;text-align:left;cursor:pointer}
.bhd{height:17%;display:grid;place-items:center}
.logo{font:900 30px/.85 'Big Shoulders Display',Impact,sans-serif;text-align:center;color:#fff}
.logo small{display:block;font:600 10px Outfit,system-ui,sans-serif;letter-spacing:.38em;margin-top:5px}
.art{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 30% 20%,#ff9a52,#e0662a 55%,#9c3a17)}
.art.g{background:radial-gradient(circle at 50% 30%,#2a8d4c,#0d3a1d 70%)}
.ttl{position:relative;z-index:1;font:800 clamp(30px,9vw,42px)/.95 Outfit,system-ui,sans-serif;text-transform:uppercase;text-align:center;text-shadow:0 4px 14px rgba(0,0,0,.4);text-wrap:balance;padding:0 10px}
.ttl small{display:block;font:600 15px/1.3 Outfit,system-ui,sans-serif;text-transform:none;margin-top:8px;opacity:.9}
.fl{position:absolute;font-size:44px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.big{font-size:96px;line-height:1;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
img.big{width:62%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.chip{position:absolute;left:10px;bottom:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;padding:4px 12px 4px 6px;border-radius:999px;background:#b5561e;color:#fff;font:700 14px Outfit,system-ui,sans-serif;border:0}
.chip svg{width:22px;height:22px}
.g .chip{background:#178a3e}
.badge{position:absolute;right:10px;bottom:10px;z-index:2;width:40px;height:40px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font:900 16px Outfit,system-ui,sans-serif;border:3px solid #000}
.badge.f{background:var(--c);color:#fff;box-shadow:0 0 18px var(--c)}
.play{display:block;margin:4px auto 0;min-width:180px;height:58px;border-radius:18px;border:3px solid var(--g);background:transparent;color:var(--gInk);font:700 26px Outfit,system-ui,sans-serif;cursor:pointer;transition:transform .15s,background .2s}
.play:hover{background:color-mix(in srgb,var(--g) 14%,transparent)}
.play:active{transform:scale(.95)}
.rings{display:flex;justify-content:space-between;margin-top:30px;padding:0 6px}
.ring{display:grid;justify-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;color:var(--ink)}
.ring>span{width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring i{width:54px;height:54px;border-radius:50%;background:var(--g);color:var(--onG);display:grid;place-items:center;font:900 22px Outfit,system-ui,sans-serif;font-style:normal}
.ring small{font:700 13px Outfit,system-ui,sans-serif;max-width:110px;text-align:center;line-height:1.2}
.tab{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--nav);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
.tab button{background:none;border:0;color:var(--ink);height:54px;display:grid;place-items:center;cursor:pointer}
.tab svg{width:32px;height:32px;stroke-width:1.5}
.tab button.on{color:var(--g)}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 12px}
h1{font:800 32px/1.05 Outfit,system-ui,sans-serif;margin:0}
h2{font:800 20px/1.2 Outfit,system-ui,sans-serif;margin:0 0 10px}
.btn{height:48px;padding:0 20px;border-radius:14px;border:2.5px solid var(--g);background:var(--g);color:var(--onG);font:700 16px Outfit,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--gInk)}
.btn.danger{background:transparent;border-color:#e5484d;color:#e5484d}
.btn.sm{height:44px;font-size:15px;padding:0 14px}
.btn:disabled{opacity:.3;cursor:default}
.lnk{background:none;border:0;color:var(--mut);font:600 15px Outfit,system-ui,sans-serif;text-decoration:underline;min-height:44px;cursor:pointer;padding:0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips button{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:600 14px Outfit,system-ui,sans-serif;cursor:pointer}
.chips button.on{border-color:var(--g);background:var(--g);color:var(--onG)}
.grp{display:flex;align-items:center;gap:8px;font:800 18px Outfit,system-ui,sans-serif;margin:20px 0 8px}
.grp em{margin-left:auto;font:600 14px Outfit,system-ui,sans-serif;color:var(--mut);font-style:normal}
.rb{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 7px;border-radius:999px;font:800 13px Outfit,system-ui,sans-serif;color:#fff;background:var(--c)}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.ico{width:52px;height:52px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 24%,transparent);overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.ico.xl{width:96px;height:96px;font-size:58px;border-radius:22px;box-shadow:0 0 0 3px var(--c)}
.rm{flex:1;display:grid}
.rm b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm small{color:var(--mut);font-size:14px}
.ib{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:transparent;color:var(--mut);display:grid;place-items:center;cursor:pointer;font:800 13px Outfit,system-ui,sans-serif}
.ib svg{width:22px;height:22px}
.ib.warn{background:#e5484d;color:#fff}
.note,.hint2{color:var(--mut);font-size:14px;margin:6px 0 10px}
.empty{color:var(--mut);text-align:center;padding:20px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.fld{display:grid;gap:6px;font:600 14px Outfit,system-ui,sans-serif;color:var(--mut);margin-bottom:14px}
input,select,textarea{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font-size:16px;padding:0 12px}
textarea{height:auto;padding:10px 12px;resize:vertical;margin:8px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font:700 15px Outfit,system-ui,sans-serif;cursor:pointer;padding:2px 4px}
.seg button.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 20%,var(--card2))}
.seg button.rk.on{border-color:var(--c);background:var(--c);color:#fff}
.seg small{display:block;font-size:11px;letter-spacing:-1px}
.emog{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;margin-bottom:8px}
.emog button{height:44px;border-radius:10px;border:1.5px solid transparent;background:var(--card2);font-size:24px;cursor:pointer}
.emog button.on{border-color:var(--g)}
.iconrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconrow input{width:76px;text-align:center;font-size:22px}
.file{position:relative}
.prev{display:grid;place-items:center;margin:4px 0 16px}
.sact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.sact .danger{margin-right:auto}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60}
.pan{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);max-height:92dvh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sub{font:800 15px Outfit,system-ui,sans-serif;color:var(--mut);margin:16px 0 6px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.kv b{font-variant-numeric:tabular-nums}
.prof{display:flex;gap:14px;align-items:flex-start}
.grow{flex:1}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) 62px 66px;gap:6px;align-items:center;margin-bottom:6px}
.prow .em{text-align:center;font-size:22px;padding:0}
.prow .num,.rate input{text-align:right}
.prow .pct{grid-column:2/4;font:600 13px Outfit,system-ui,sans-serif;color:var(--mut)}
.prow .ib{grid-column:4;justify-self:end}
.rates{display:grid;gap:8px}
.rate{display:grid;grid-template-columns:minmax(0,1fr) 80px 64px;gap:8px;align-items:center;font-weight:700;color:var(--c)}
.rate b{color:var(--mut);text-align:right;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;display:grid}
.stats b{font:800 clamp(18px,5vw,24px)/1.1 Outfit,system-ui,sans-serif;white-space:nowrap}
.stats small{color:var(--mut);font-size:13px}
.bar{display:grid;grid-template-columns:minmax(0,9em) 1fr 28px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{position:relative;height:12px;border-radius:9px;background:var(--card2)}
.trk i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--c)}
.trk u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.bar b{text-align:right}
.hrow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.hh{display:flex;align-items:center;gap:8px}
.hh time{margin-left:auto;color:var(--mut);font-size:13px;white-space:nowrap}
.hi{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:999px;font-size:14px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1.5px solid var(--c)}
.tag .ti{width:22px;height:22px;border-radius:50%;object-fit:cover;font-size:16px;display:grid;place-items:center}
.hf{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.hf b{color:var(--ink);margin-left:auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg2);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ===== Booster overlay ===== */
.ov{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 38%,var(--ov1),var(--ov2) 80%);color:var(--ovInk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:hidden}
.ovh{font:800 22px Outfit,system-ui,sans-serif;margin:0;text-align:center}
.ovsub{margin:0;color:var(--mut);min-height:24px;text-align:center}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:9px;background:color-mix(in srgb,var(--ovInk) 22%,transparent)}
.dots i.done{background:var(--g)}
.dots i.on{background:var(--g);width:36px}
.ovact{display:flex;gap:10px;align-items:center}
.ovact .btn{min-width:150px}
.pack{width:min(290px,68vw);aspect-ratio:3/4.4;border-radius:22px;background:#000;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 22px 60px rgba(0,0,0,.45);animation:bob 2.4s ease-in-out infinite;padding:0;border:0;color:#fff}
.pack .strip{position:absolute;top:0;left:0;right:0;height:12%;z-index:3;background:linear-gradient(90deg,#35d16b,#1c9a47);clip-path:polygon(0 0,100% 0,100% 70%,95% 100%,90% 70%,85% 100%,80% 70%,75% 100%,70% 70%,65% 100%,60% 70%,55% 100%,50% 70%,45% 100%,40% 70%,35% 100%,30% 70%,25% 100%,20% 70%,15% 100%,10% 70%,5% 100%,0 70%);display:grid;place-items:center;color:#06140a;font:800 11px Outfit,system-ui,sans-serif;letter-spacing:.2em}
.pack .bhd{height:26%;place-items:end center;padding-bottom:8px}
.pack .art::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.4) 48%,transparent 60%);background-size:250% 100%;animation:shine 2.6s linear infinite}
.pack.open{animation:shake .5s ease-in-out,gone .55s .85s ease-in forwards}
.pack.open .strip{animation:rip .5s .1s ease-in forwards}
.fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.fx .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0,var(--c) 20%,transparent 64%);opacity:0;animation:flash 1.3s .3s forwards}
.fx .streak{position:absolute;top:18%;left:-70%;width:70%;height:6px;border-radius:9px;background:linear-gradient(90deg,transparent,var(--c),#fff);box-shadow:0 0 26px 8px var(--c);transform:rotate(20deg);animation:streak .7s ease-in forwards}
.flip{width:min(290px,66vw);aspect-ratio:3/4.3;perspective:1200px;cursor:pointer;position:relative;border:0;background:none;padding:0}
.flip:not(.on){animation:bob 2.2s ease-in-out infinite}
.flip .in{position:absolute;inset:0;transition:transform .8s cubic-bezier(.2,.8,.25,1.15);transform-style:preserve-3d;z-index:1}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,#000 0 14px,#06200f 14px 28px);border:3px solid var(--g);display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.front{transform:rotateY(180deg);background:#000;display:flex;flex-direction:column;color:#fff;transition:box-shadow .5s .4s}
.flip.on .front{box-shadow:0 0 0 3px var(--c),0 0 70px 12px color-mix(in srgb,var(--c) 65%,transparent)}
.fhd{height:15%;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font:800 18px Outfit,system-ui,sans-serif}
.stars{color:var(--c);font-size:18px;letter-spacing:1px}
.stars span{display:inline-block;opacity:0}
.flip.on .stars span{animation:pop .4s both;animation-delay:calc(.7s + var(--i)*.14s)}
.fart{flex:1;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 80%,#fff),color-mix(in srgb,var(--c) 50%,#000) 78%);padding-bottom:22%}
.fname{position:absolute;bottom:0;left:0;right:0;padding:44px 14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.8));text-align:center;display:grid;gap:4px}
.fname b{font:800 25px/1 Outfit,system-ui,sans-serif;text-transform:uppercase;text-wrap:balance}
.fname small{font-size:14px;opacity:.85}
.rS .front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);background-size:260% 100%;background-position:120% 0;pointer-events:none}
.rS.on .front::after{animation:shine 1.6s 1s ease-out}
.rays{position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--c) 50%,transparent) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);opacity:0;transition:opacity .7s .5s;animation:spin 16s linear infinite;z-index:0;pointer-events:none}
.flip.on .rays{opacity:1}
.pt{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:burst 1.1s ease-out both;z-index:2;pointer-events:none}
.ask{display:grid;justify-items:center;gap:6px;text-align:center;background:var(--ovRow);border:2px solid var(--g);border-radius:24px;padding:26px 20px;width:min(340px,100%);animation:rise .4s both}
.askic{font-size:72px;line-height:1}
.ask h2{font-size:30px;margin:6px 0 0}
.ask p{margin:0 0 12px;color:var(--mut)}
.askb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.recap{width:min(420px,100%);max-height:100%;overflow:auto;display:grid;gap:8px;padding:4px}
.recap h2{font-size:32px;text-align:center;margin:0}
.rr{display:flex;align-items:center;gap:12px;background:var(--ovRow);border-radius:16px;padding:8px;animation:rise .5s both;animation-delay:calc(var(--i)*.12s)}
.rtot{display:flex;justify-content:space-between;font:800 20px Outfit,system-ui,sans-serif;padding:8px 6px;border-top:2px solid var(--g);margin-top:4px}

function rollRank(min){const R=S.settings.rates;const r=wpick(RL,k=>Math.max(0,+R[k]||0))||'B';return rv[r]<rv[min]?min:r}

const total=h=>CATS.reduce((a,[k])=>a+((h.slots[k]&&h.slots[k].price)||0),0);

const placesOf=m=>S.places.filter(p=>+p.weight>0&&inMode(p,m));
function pickItem(pid,cat,rank,min,cap,m){
  const pool=poolOf(pid,cat,m).filter(i=>pr(i)<=cap+1e-9);if(!pool.length)return null;
  const have=RL.filter(r=>pool.some(i=>i.rank==r));
  let ok=have.filter(r=>rv[r]>=rv[min]);if(!ok.length)ok=have;
  ok.sort((x,y)=>Math.abs(rv[x]-rv[rank])-Math.abs(rv[y]-rv[rank])||rv[x]-rv[y]);
  const rec=recent();return wpick(pool.filter(i=>i.rank==ok[0]),i=>rec.has(i.id)?.35:1);
}
const pickSlot=(pid,cat,min,cap,m)=>pickItem(pid,cat,rollRank(min),min,cap,m);

  const fed=all.filter(p=>poolOf(p.id,Mo.main,m).length);if(!fed.length)return toast(`Aucun(e) ${catL(Mo.main,m).toLowerCase()} au catalogue pour le ${Mo.l.toLowerCase()} : ajoutes-en dans Catalogue`);
  const P=fed.filter(p=>needCost(p.id,m)<=B+1e-9);
  if(!P.length)return toast(`Budget trop serré : il faut au moins ${eur(Math.min(...all.map(p=>needCost(p.id,m))))}`);
  SFX.open();
  const f=force(m);let c=P;
  const others=(pid,cat)=>Mo.must.filter(k=>k!=cat).reduce((a,k)=>a+minPrice(pid,k,m),0);
  const goodS=p=>S.items.some(i=>i.placeId==p.id&&inMode(i,m)&&i.rank=='S'&&Mo.must.includes(i.cat)&&pr(i)+others(p.id,i.cat)<=B+1e-9);
  if(f=='S'){c=P.filter(p=>rv[p.rank]>=1&&goodS(p));if(!c.length)c=P.filter(goodS);if(!c.length)c=P.filter(p=>rv[p.rank]>=1)}
  else if(f=='A')c=P.filter(p=>rv[p.rank]>=1);
  if(!c.length)c=P;

  const slots={boisson:null,entree:null,plat:null,dessert:null};
  const order=[Mo.main,...Mo.must.filter(k=>k!=Mo.main)];let spent=0;
  order.forEach((k,j)=>{const rest=order.slice(j+1).reduce((a,x)=>a+minPrice(place.id,x,m),0);const it=pickSlot(place.id,k,j==0?(f||'B'):'B',B-spent-rest,m);slots[k]=it;spent+=pr(it)});

const RADII=[300,500,1000,2000,5000];
const fmtR=r=>r<1000?r+' m':(r/1000).toLocaleString('fr-FR')+' km';
const MDESC={matin:'petit-déjeuner (boulangeries, cafés, supérettes ouvertes tôt)',midi:'déjeuner',gouter:'goûter / en-cas de l’après-midi',soir:'dîner (lieux ouverts le soir)'};
function cleanPlace(o){if(!o||typeof o!='object'||!o.name)return null;const rk=r=>RL.includes(r)?r:'B',CK=CATS.map(c=>c[0]);
  return{name:String(o.name).slice(0,40),emoji:String(o.emoji||'📍').slice(0,8),type:String(o.type||'').slice(0,40),address:String(o.address||'').slice(0,90),dist:Math.max(0,Math.round(+o.distance_m||0)),price:Math.min(3,Math.max(1,Math.round(+o.price_level||1))),rank:rk(o.rank),conf:['haute','moyenne','faible'].includes(o.confidence)?o.confidence:'faible',why:String(o.why||'').slice(0,160),
    items:(Array.isArray(o.items)?o.items:[]).filter(i=>i&&i.name&&CK.includes(i.cat)).slice(0,6).map(i=>({name:String(i.name).slice(0,40),cat:i.cat,price:Math.max(0,Math.round((+i.price||0)*100)/100),rank:rk(i.rank),emoji:String(i.emoji||'🍽️').slice(0,8)}))}}
function scanPrompt(x,m){const B=S.settings.budgets[m],names=S.places.map(p=>p.name).join(', ')||'aucun';
  return `Tu es l’assistant « Explorer » d’une petite app perso qui tire au sort où manger (style gacha).
Point de départ : ${x.origin}
Rayon : ${fmtR(x.radius)} autour de ce point.
Moment : ${MDESC[m]}.
Budget max par repas : ${B==null?'aucun':eur(B)}.
Envies : ${x.wish||'aucune précision'}.
Établissements déjà dans l’app (ne pas les reproposer) : ${names}.

Liste jusqu’à 8 établissements réels où manger à ce moment dans ce périmètre (boulangeries, snacks, fast-foods, restaurants, cafés, supérettes…), compatibles avec le budget et les envies.
Règles :
- Tu n’as ni internet ni GPS : ne propose que des établissements dont tu penses qu’ils existent vraiment à cet endroit. N’invente rien. Si tu n’es pas sûr de l’adresse exacte, donne seulement la rue ou le quartier. Mieux vaut 3 résultats fiables que 8 douteux.
- "confidence" : "haute" si tu es sûr que le lieu existe à cet endroit, "moyenne" si c’est probable, "faible" sinon.
- "distance_m" : estimation en mètres depuis le point de départ.
- "price_level" : 1 (pas cher), 2 ou 3 (cher).
- "rank" du lieu : "B" = simple et pas cher, on peut y aller souvent ; "A" = plus sympa ou un peu plus cher ; "S" = le plus appétissant ou cher, à garder rare.
- "items" : 3 à 6 produits typiques pour ce moment, avec "cat" parmi "boisson", "entree", "plat", "dessert" (au petit-déj, la viennoiserie est un "plat" ; au goûter, le goûter est un "dessert"), un "price" estimé en euros et un "rank" (B = basique, A = mieux, S = le plus gourmand ou cher). Inclus au moins une boisson et un plat (ou un dessert pour le goûter).
- "why" : une phrase courte en français.
Réponds uniquement avec un tableau JSON, sur ce modèle :
[{"name":"Nom du lieu","emoji":"🌯","type":"Snack","address":"Rue X","distance_m":400,"price_level":1,"rank":"B","confidence":"haute","why":"Pas cher et rapide.","items":[{"name":"Canette","cat":"boisson","price":2,"rank":"B","emoji":"🥤"},{"name":"Tacos M","cat":"plat","price":7.5,"rank":"B","emoji":"🌯"}]}]`}
function resultsHTML(r){const n=r.list.length;
  return `<h2 class="sub" style="font-size:18px;color:var(--ink)">${n} lieu${n>1?'x':''} proposé${n>1?'s':''} <small class="pc">· ${MODES[r.mode].e} ${fmtR(r.radius)} autour de ${esc(r.origin)}</small></h2>
  ${r.list.map((p,j)=>{const ex=S.places.some(x=>x.name.trim().toLowerCase()==p.name.trim().toLowerCase());const q=encodeURIComponent(p.name+' '+(p.address||'')+' '+r.origin);
  return `<article class="xr" style="--c:${RK[p.rank].c};animation-delay:${j*.06}s"><div class="xh"><div class="ico">${esc(p.emoji)}</div><div class="rm"><b>${esc(p.name)}</b><small>${esc(p.type)}${p.dist?' · ~'+fmtR(p.dist):''} · ${'€'.repeat(p.price)}</small></div><span class="rb">${p.rank}</span></div>
  ${p.address?`<p class="xa">📍 ${esc(p.address)}</p>`:''}${p.why?`<p class="xw">${esc(p.why)}</p>`:''}
  <div class="hi">${p.items.map(i=>`<span class="tag" style="--c:${RK[i.rank].c}">${esc(i.emoji)} ${esc(i.name)}${i.price?' · '+eur(i.price):''}</span>`).join('')}</div>
  <div class="xf"><span class="conf c-${p.conf}">Fiabilité IA : ${p.conf}</span><a class="lnk" href="https://www.google.com/maps/search/?api=1&amp;query=${q}" target="_blank" rel="noopener">Vérifier sur Maps</a>${ex?'<span class="pc">Déjà dans ton catalogue</span>':`<button class="btn sm" data-act="xadd" data-v="${j}">+ Ajouter</button>`}</div></article>`}).join('')}
  <p class="hint2">Un lieu ajouté arrive dans ton Catalogue avec le badge « IA · à vérifier », uniquement pour le moment choisi. Corrige les prix avec tes vraies additions.</p>`}
const KW={matin:['boulangerie','café'],midi:['snack','boulangerie','fast food'],gouter:['boulangerie','pâtisserie','glacier'],soir:['restaurant','tacos','pizza','sushi']};
function mapsUrl(k,x){return x.coords?`https://www.google.com/maps/search/${encodeURIComponent(k)}/@${x.coords[0]},${x.coords[1]},${({300:17,500:16,1000:15,2000:14,5000:13})[+x.radius]||15}z`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(k+' près de '+x.origin)}`}
function explore(){
  const x=S.settings.explore,m=x.mode||curMode(),B=S.settings.budgets[m],r=x.last,ai=!!(window.claude&&window.claude.use);
  return `<div class="vh"><h1>Explorer <span class="aib">IA</span></h1></div>
  ${ai?'':`<section class="ainote" style="border-color:var(--g)"><b>🗺️ Version installée : l’analyse IA est désactivée.</b> Elle ne fonctionne que quand l’app est ouverte dans Claude. Ici, utilise la recherche rapide sur Maps (gratuite, données à jour) et ajoute tes lieux à la main dans le Catalogue.</section>`}
  <section class="ainote" ${ai?'':'hidden'}><b>🤖 Cet onglet utilise l’IA (Claude).</b> Elle propose des établissements autour d’une adresse à partir de ses connaissances : pas de GPS, pas d’accès à internet en direct. Adresses, horaires et prix peuvent donc être faux ou dépassés : vérifie sur Maps avant d’ajouter. Chaque analyse consomme un peu de ton quota Claude. Ton catalogue manuel reste la référence : rien n’y entre sans ton clic.</section>
  <section class="box">
   <label class="fld">Point de départ<input data-f="x:origin" value="${esc(x.origin)}" placeholder="Adresse de ton école, rue, quartier…" maxlength="120"></label><button class="btn ghost sm" data-act="xgeo" style="margin:-6px 0 14px">📍 Utiliser ma position</button>
   <div class="fld">Rayon<div class="bpre l">${RADII.map(v=>`<button class="${+x.radius==v?'on':''}" data-act="xrad" data-v="${v}">${fmtR(v)}</button>`).join('')}</div></div>
   <div class="fld">Pour quel moment ?<div class="seg">${MO.map(k=>`<button class="${k==m?'on':''}" data-act="xmode" data-v="${k}">${MODES[k].e}<small>${MODES[k].l}</small></button>`).join('')}</div></div>
   <label class="fld">Envies (optionnel)<input data-f="x:wish" value="${esc(x.wish)}" placeholder="Ex. tacos, healthy, pas cher, asiatique…" maxlength="80"></label>
   <div class="fld">Recherche rapide sur Maps (sans IA)<div class="bpre l">${[...KW[m],...(x.wish?[x.wish]:[])].map(k=>`<a class="mchip" href="${mapsUrl(k,x)}" target="_blank" rel="noopener">🔎 ${esc(k)}</a>`).join('')}</div></div>
   <p class="hint2" ${ai?'':'hidden'}>Budget pris en compte : ${B==null?'illimité':eur(B)} (réglable sur l’accueil, en mode ${MODES[m].l.toLowerCase()}).</p>
   ${!ai?'':scan.busy?`<div class="btns"><button class="btn" disabled><span class="spin"></span> L’IA analyse le quartier…</button><button class="btn ghost" data-act="xstop">Stop</button></div>`:`<div class="btns"><button class="btn" data-act="xscan">✨ Analyser avec l’IA</button>${r?'<button class="btn ghost sm" data-act="xscan" data-v="r">Relancer</button>':''}</div>`}
   ${scan.err?`<p class="bhint bad" style="text-align:left;margin-top:10px">${esc(scan.err)}</p>`:''}
  </section>
  ${r&&r.list.length?resultsHTML(r):''}`;
}
async function runScan(refresh){
  const x=S.settings.explore,m=x.mode||curMode();if(!String(x.origin).trim())return toast('Indique un point de départ');
  let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}
  if(!sample){scan.err='L’IA n’est pas disponible ici : ouvre l’app depuis Claude, connecté à ton compte.';render();return}
  scan.busy=true;scan.err='';scan.ctl=new AbortController();render();SFX.open();
  try{
    const data=await sample.json(scanPrompt(x,m),{signal:scan.ctl.signal,cache:refresh?{gcTime:3600000,refresh:true}:{gcTime:3600000}});
    const list=(Array.isArray(data)?data:(data&&Array.isArray(data.places)?data.places:[])).map(cleanPlace).filter(Boolean).slice(0,8);
    x.last={t:Date.now(),origin:x.origin,radius:+x.radius,mode:m,list};save();
    if(list.length){SFX.recap();toast(`${list.length} lieu${list.length>1?'x':''} trouvé${list.length>1?'s':''}`)}else scan.err='L’IA n’a rien trouvé de fiable dans ce périmètre. Élargis le rayon ou précise l’adresse.';
  }catch(e){const c=e&&e.code;scan.err=c=='cancelled'?'':c=='not_granted'||c=='sampling_disabled'||c=='not_declared'||c=='capability_disabled'?'Accès à l’IA refusé ou indisponible pour ce compte.':c=='rate_limited'?'Trop de demandes ou quota atteint : réessaie plus tard.':c=='invalid_json'?'Réponse illisible : relance l’analyse.':c=='session_expired'?'Session expirée : reconnecte-toi à Claude.':'L’analyse a échoué, réessaie.'}
  scan.busy=false;scan.ctl=null;if(view=='explore')render();
}

function resize(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/webp',.82);if(!u.startsWith('data:image/webp'))u=c.toDataURL('image/png');res(u)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function doImport(txt){try{const d=JSON.parse(txt);if(!Array.isArray(d.places)||!Array.isArray(d.items))throw 0;S=fix(d);save();applyTheme();render();toast('Sauvegarde importée')}catch(e){toast('Sauvegarde invalide')}}

function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fitText(c,t,max,size,weight,fam){let z=size;do{c.font=`${weight} ${z}px ${fam}`;z-=2}while(c.measureText(t).width>max&&z>18);return t}
function clip(c,t,max){if(c.measureText(t).width<=max)return t;while(t.length>1&&c.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'}
const loadImg=src=>new Promise(r=>{if(!src)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src});

let pdT;function armDel(id){pendDel=id;clearTimeout(pdT);pdT=setTimeout(()=>{pendDel=null;if(sh.hidden)render();else if(draft){syncDraft();sheet(itemForm())}},3500)}
const A={
  tab:b=>{SFX.soft();closeSheet();view=b.dataset.v;pendDel=null;render();scrollTo(0,0)},
  open:()=>openBooster(),
  mode:b=>{SFX.soft();const v=b.dataset.v;modeOver=v==autoMode()?null:v;render()},
  mauto:()=>{SFX.soft();modeOver=null;render()},
  rates:()=>ratesSheet(),
  theme:()=>{S.settings.theme=isDark()?'light':'dark';save();applyTheme();if(view=='set')render()},
  settheme:b=>{S.settings.theme=b.dataset.v;save();applyTheme();render()},
  close:()=>closeSheet(),
  filter:b=>{catFilter=b.dataset.v;render()},
  cmode:b=>{catMode=b.dataset.v;render()},
  hmode:b=>{histMode=b.dataset.v;render()},
  add:()=>openItem(null),
  edit:b=>openItem(b.dataset.id),
  del:b=>{const id=b.dataset.id;if(pendDel!=id){armDel(id);render();return}S.items=S.items.filter(i=>i.id!=id);pendDel=null;save();render();toast('Aliment supprimé')},
  delsheet:()=>{syncDraft();if(pendDel!=draft.id){armDel(draft.id);sheet(itemForm());return}S.items=S.items.filter(i=>i.id!=draft.id);pendDel=null;save();closeSheet();render();toast('Aliment supprimé')},
  dcat:b=>{syncDraft();draft.cat=b.dataset.v;sheet(itemForm())},
  drank:b=>{syncDraft();draft.rank=b.dataset.v;sheet(itemForm())},
  dmode:b=>{syncDraft();const v=b.dataset.v,ms=draft.modes;if(ms.includes(v)){if(ms.length>1)ms.splice(ms.indexOf(v),1);else toast('Garde au moins un moment')}else ms.push(v);sheet(itemForm())},
  demo:b=>{syncDraft();draft.emoji=b.dataset.v;draft.img=null;sheet(itemForm())},
  noimg:()=>{syncDraft();draft.img=null;sheet(itemForm())},
  saveitem:()=>{syncDraft();const d=draft;d.name=d.name.trim();if(!d.name){toast('Donne un nom à ton aliment');$('#fName').focus();return}
    d.price=d.price===''||d.price==null?'':Math.max(0,+String(d.price).replace(',','.')||0);d.emoji=d.emoji||'🍽️';d.modes=MO.filter(m=>d.modes.includes(m));
    const p=S.places.find(x=>x.id==d.placeId),added=p?d.modes.filter(m=>!inMode(p,m)):[];if(p&&added.length){p.modes=MO.filter(m=>inMode(p,m)||added.includes(m))}
    if(d.id){const i=S.items.findIndex(x=>x.id==d.id);d.ex=false;d.ia=false;S.items[i]=d}else S.items.push({...d,id:uid(),ex:false});
    save();closeSheet();render();toast(added.length?`Enregistré · ${p.name} ajouté à : ${added.map(m=>MODES[m].l).join(', ')}`:'Enregistré')},
  addplace:()=>{const m=curMode();S.places.push({id:uid(),name:'Nouveau lieu',emoji:'📍',rank:'A',weight:10,modes:[m]});save();render()},
  pmode:b=>{const p=S.places.find(x=>x.id==b.dataset.id);if(!p)return;const v=b.dataset.v,ms=MO.filter(m=>inMode(p,m));p.modes=ms.includes(v)?ms.filter(m=>m!=v):MO.filter(m=>ms.includes(m)||m==v);SFX.soft();save();render()},
  delplace:b=>{const id=b.dataset.id;if(pendDel!=id){armDel(id);render();const n=S.items.filter(i=>i.placeId==id).length;if(n)toast(`Ça supprimera aussi ${n} aliment${n>1?'s':''}`);return}S.places=S.places.filter(p=>p.id!=id);S.items=S.items.filter(i=>i.placeId!=id);if(catFilter==id)catFilter='all';pendDel=null;save();render()},
  noav:()=>{S.settings.avatarImg=null;save();render()},
  export:()=>{const t=JSON.stringify(S);const ta=$('#imp');ta.value=t;ta.select();try{navigator.clipboard.writeText(t).then(()=>toast('Sauvegarde copiée'),()=>toast('Copie bloquée : sélectionne le texte et copie-le'))}catch(e){toast('Sélectionne le texte et copie-le')}},
  import:()=>{const t=$('#imp').value.trim();if(!t)return toast('Colle une sauvegarde d’abord');doImport(t)},
  clearex:()=>{S.items=S.items.filter(i=>!i.ex);save();render();toast('Exemples supprimés')},
  clearhist:()=>{S.history=[];S.pity=newPity();save();render();toast('Historique effacé')},
  reset:()=>{if(!pendReset){pendReset=true;render();setTimeout(()=>{pendReset=false;if(view=='set')render()},3500);return}pendReset=false;S=seed();save();applyTheme();view='home';modeOver=null;render();toast('Tout est remis à zéro')},
  share:async b=>{const h=S.history.find(x=>x.id==b.dataset.id);if(!h)return;SFX.tap();toast('Création de l’image…');
    const blob=await makeImg(h);if(!blob)return toast('Impossible de créer l’image');if(shareUrl)URL.revokeObjectURL(shareUrl);shareBlob=blob;shareUrl=URL.createObjectURL(blob);shareName=`gachamidi-${h.mode||'midi'}-${new Date(h.t).toISOString().slice(0,10)}.jpg`;
    sheet(`<h2>Partager ton repas</h2><img class="shimg" src="${shareUrl}" alt="Récap du booster en image"><p class="hint2">Sur l’app Claude mobile, « Enregistrer » ouvre le menu de partage (WhatsApp, Insta, Snap…). Sinon, appui long sur l’image.</p><div class="sact"><button class="btn ghost sm" data-act="close">Fermer</button><button class="btn sm" data-act="savejpg">${I.share} Enregistrer le JPG</button></div>`)},
  savejpg:async()=>{if(!shareBlob)return;let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(!dl){const file=new File([shareBlob],shareName,{type:'image/jpeg'});
      try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Mon repas Gacha’Midi'});SFX.yes();return}}catch(e){if(e&&e.name=='AbortError')return}
      try{const a=document.createElement('a');a.href=shareUrl;a.download=shareName;document.body.appendChild(a);a.click();a.remove();toast('Image téléchargée');return}catch(e){}
      return toast('Appuie longuement sur l’image pour l’enregistrer')}
    try{await dl.save({filename:shareName,data:shareBlob});toast('Image enregistrée');SFX.yes()}catch(err){const k=err&&err.code;toast(k=='declined'?'Enregistrement annulé':k=='rate_limited'?'Une demande est déjà ouverte':'Appuie longuement sur l’image pour l’enregistrer')}},
  testsfx:()=>{SFX.tear('S');setTimeout(()=>SFX.reveal('S'),1400)},
  bstep:b=>{SFX.soft();const B=S.settings.budgets,m=curMode(),d=+b.dataset.v;if(B[m]==null)B[m]=d<0?10:15;else B[m]=Math.max(1,Math.round((B[m]+d*.5)*2)/2);save();render()},
  bset:b=>{SFX.soft();S.settings.budgets[curMode()]=b.dataset.v===''?null:+b.dataset.v;save();render()},
  xscan:b=>runScan(b.dataset.v=='r'),
  xstop:()=>{if(scan.ctl)scan.ctl.abort()},
  xrad:b=>{S.settings.explore.radius=+b.dataset.v;save();SFX.soft();render()},
  xmode:b=>{S.settings.explore.mode=b.dataset.v;save();SFX.soft();render()},
  xadd:b=>{const r=S.settings.explore.last,p=r&&r.list[+b.dataset.v];if(!p)return;const id=uid(),m=r.mode;
    S.places.push({id,name:p.name,emoji:p.emoji,rank:p.rank,weight:{B:30,A:15,S:5}[p.rank],modes:[m],ia:true});
    p.items.forEach(i=>S.items.push({id:uid(),placeId:id,cat:i.cat,rank:i.rank,emoji:i.emoji,name:i.name,price:i.price||'',img:null,ex:false,ia:true,modes:[m]}));
    save();SFX.yes();render();toast(`${p.name} ajouté au ${MODES[m].l.toLowerCase()} · ${p.items.length} aliment${p.items.length>1?'s':''}`)},
  xgeo:()=>{if(!navigator.geolocation)return toast('GPS indisponible sur cet appareil');toast('Recherche de ta position…');
    navigator.geolocation.getCurrentPosition(p=>{const x=S.settings.explore,la=p.coords.latitude.toFixed(5),lo=p.coords.longitude.toFixed(5);x.coords=[la,lo];x.origin=`Ma position (${la}, ${lo})`;save();render();toast('Position trouvée')},()=>toast('Position refusée ou bloquée (dans Claude, le GPS est bloqué : tape ton adresse)'),{enableHighAccuracy:true,timeout:10000})},
  exportfile:()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`gachamidi-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();toast('Sauvegarde téléchargée')}catch(e){toast('Téléchargement impossible ici')}},
  next:()=>{SFX.tap();seq.i++;ovRender()},
  skip:()=>{SFX.soft();seq.i=seq.steps.length-1;ovRender()},
  ask:b=>{b.dataset.v=='1'?SFX.yes():SFX.soft();const k=seq.steps[seq.i].slice(4);if(b.dataset.v=='1'){const it=pickSlot(seq.e.place.id,k,'B',remOf(seq.e),seq.e.mode);seq.e.slots[k]=snap(it);if(it)bump(it.rank,seq.e.mode);save();seq.steps.splice(seq.i+1,0,k)}seq.i++;ovRender()},
  closeov:()=>{ov.hidden=true;ov.innerHTML='';document.body.style.overflow='';seq=null;view='home';render()}
};
document.addEventListener('click',e=>{
  if(e.target===sh){closeSheet();return}
  const p=e.target.closest('#pack');if(p){tear(p);return}
  const f=e.target.closest('#flip');if(f){flipCard(f);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act=='del'||b.dataset.act=='rates')e.stopPropagation();
  const fn=A[b.dataset.act];if(fn)fn(b,e);
},true);
document.addEventListener('input',e=>{
  if(e.target.id=='fEmo'&&draft&&!draft.img){$('#pv').innerHTML=icon(e.target.value,null);return}
  const f=e.target.dataset.f;if(!f)return;const v=e.target.value,s=S.settings;
  if(f=='sound'||f=='vibe')s[f]=e.target.checked;else if(f=='volume')s.volume=+v;else if(f=='pseudo')s.pseudo=v;else if(f=='avatar')s.avatar=v||'😋';
  else if(f.startsWith('hour:')){if(v){s.hours[f.slice(5)]=v;applyTheme()}}
  else if(f.startsWith('x:')){s.explore[f.slice(2)]=v;if(f=='x:origin')delete s.explore.coords}
  else if(f.startsWith('rate:'))s.rates[f.slice(5)]=Math.max(0,+v||0);
  else if(f=='pityA'||f=='pityS'){if(v!=='')s[f]=Math.max(1,Math.round(+v||1))}
  else if(f.startsWith('p:')){const [,id,k]=f.split(':');const pl=S.places.find(x=>x.id==id);if(pl)pl[k]=k=='weight'?Math.max(0,+v||0):v}
  save();updPct();hdr();
});
document.addEventListener('change',async e=>{const t=e.target,file=t.files&&t.files[0];if(!file)return;
  try{
    if(t.id=='fImg'){syncDraft();draft.img=await resize(file,200);sheet(itemForm())}
    else if(t.id=='fAv'){S.settings.avatarImg=await resize(file,160);save();render()}
    else if(t.id=='fImp'){doImport(await file.text())}
  }catch(err){toast('Impossible de lire ce fichier')}
});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!sh.hidden)closeSheet()});
document.querySelectorAll('#tab button').forEach((b,j)=>b.innerHTML=[I.home,I.cards,I.compass,I.clock,I.menu][j]);
$('#bInfo').innerHTML=I.info;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
document.addEventListener('pointermove',e=>{const b=e.target.closest&&e.target.closest('#bst');if(!b||reduce)return;const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;b.style.setProperty('--ry',(x-.5)*16+'deg');b.style.setProperty('--rx',(.5-y)*16+'deg');b.style.setProperty('--fx',x*100+'%');b.style.setProperty('--fy',y*100+'%')});
document.addEventListener('pointerout',e=>{const b=e.target.closest&&e.target.closest('#bst');if(b&&!b.contains(e.relatedTarget)){b.style.setProperty('--rx','0deg');b.style.setProperty('--ry','0deg')}});
let pj=0,lastAuto=autoMode();
setInterval(()=>{
  const a=autoMode();if(a!=lastAuto){lastAuto=a;applyTheme();if(view=='home'&&!seq&&sh.hidden){if(modeOver==a)modeOver=null;render()}}
  if(reduce)return;const pl=$('#plate');if(!pl)return;const e=emojisOf(curMode());if(e.length<2)return;const sp=pl.firstElementChild;sp.classList.add('out');setTimeout(()=>{pj=(pj+1)%e.length;sp.textContent=e[pj];sp.classList.remove('out')},350)},1800);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view=='home'&&!seq&&sh.hidden)render()});
applyTheme();render();
}

</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>

<style>
/* VOICE: gacha de cour de récré, gamifié façon appli d'apprentissage, punchy et lisible en 2 secondes.
   IDEA: un booster de cartes à collectionner + une mascotte brioche affamée (Tarpi) qui réagit aux tirages.
   PICTURE: booster qui se déchire au swipe, cartes qui se retournent, pluie de confettis, XP qui grimpe.
   COLOUR and TYPE: accent par ambiance (orange aube, bleu roi midi, framboise goûter, vert néon nuit), rangs bleu/violet/or. Outfit + Big Shoulders.
   LAYOUT: colonne mobile 480px, accueil qui tient sur un écran, boutons 3D, tab bar à icônes duotone. */
:root{--bg1:#74c3f5;--bg2:#eaf6ff;--ink:#0b1f33;--mut:#4c6a85;--card:#fff;--card2:#eef6fd;--line:#cfe3f3;--g:#1e6fe0;--gD:#1553ad;--onG:#fff;--gInk:#1553ad;--nav:#fff;--ov1:#fff;--ov2:#a9dcfb;--ovInk:#0b1f33;--ovRow:#fff;color-scheme:light}
:root[data-cycle=matin]{--bg1:#ffd9b8;--bg2:#fff6ec;--ink:#2a1a0e;--mut:#7a5e48;--card:#fffaf4;--card2:#fbeee0;--line:#f0d9c2;--g:#f26b1d;--gD:#c24f0d;--onG:#fff;--gInk:#c4500f;--nav:#fffaf4;--ov1:#fffaf4;--ov2:#ffd9b8;--ovInk:#2a1a0e;--ovRow:#fff}
:root[data-cycle=midi]{--bg1:#74c3f5;--bg2:#eaf6ff;--ink:#0b1f33;--mut:#4c6a85;--card:#fff;--card2:#eef6fd;--line:#cfe3f3;--g:#1e6fe0;--gD:#1553ad;--onG:#fff;--gInk:#1553ad;--nav:#fff;--ov1:#fff;--ov2:#a9dcfb;--ovInk:#0b1f33;--ovRow:#fff}
:root[data-cycle=gouter]{--bg1:#ffb3b8;--bg2:#fff1e6;--ink:#2b140f;--mut:#80594c;--card:#fffaf6;--card2:#fdeee6;--line:#f3d6c8;--g:#e3406b;--gD:#ad284d;--onG:#fff;--gInk:#ad284d;--nav:#fffaf6;--ov1:#fffaf6;--ov2:#ffc9a8;--ovInk:#2b140f;--ovRow:#fff}
:root[data-cycle=soir]{--bg1:#1d2a6b;--bg2:#05071a;--ink:#eef1ff;--mut:#a3abdb;--card:#0c1030;--card2:#151a45;--line:#2a3070;--g:#ffb627;--gD:#c98500;--onG:#2a1600;--gInk:#ffc94d;color-scheme:dark;--nav:#04061a;--ov1:#1f2c75;--ov2:#02030f;--ovInk:#fff;--ovRow:rgba(255,255,255,.07)}
:root[data-cycle] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;will-change:transform}
:root[data-cycle=matin] body::before{background:radial-gradient(circle at 86% 5%,#fff3c4 0 34px,rgba(255,200,120,.55) 36px,transparent 190px)}
:root[data-cycle=midi] body::before{background:radial-gradient(circle at 90% 4%,#fff7b0 0 26px,rgba(255,240,150,.5) 28px,transparent 120px),radial-gradient(70px 24px at 16% 9%,rgba(255,255,255,.95),transparent 72%),radial-gradient(100px 32px at 26% 11%,rgba(255,255,255,.85),transparent 72%),radial-gradient(90px 28px at 68% 19%,rgba(255,255,255,.9),transparent 72%),radial-gradient(120px 36px at 78% 21%,rgba(255,255,255,.75),transparent 72%);animation:drift 40s ease-in-out infinite alternate}
:root[data-cycle=gouter] body::before{background:radial-gradient(circle at 12% 6%,#ffe7b8 0 30px,rgba(255,170,110,.5) 32px,transparent 200px)}
:root[data-cycle=soir] body::before{background:radial-gradient(circle at 86% 6%,#fffbe6 0 18px,rgba(255,250,220,.25) 19px,transparent 70px),radial-gradient(1.5px 1.5px at 10% 12%,#fff,transparent),radial-gradient(1px 1px at 22% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 35% 8%,#fff,transparent),radial-gradient(1px 1px at 48% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 4%,#fff,transparent),radial-gradient(1px 1px at 70% 28%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 26%,#fff,transparent),radial-gradient(1px 1px at 5% 40%,#fff,transparent),radial-gradient(1px 1px at 96% 50%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 46%,#fff,transparent);animation:twinkle 4s ease-in-out infinite}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html.paused *,html.paused *::before,html.paused *::after{animation-play-state:paused!important}
body{margin:0;min-height:100dvh;background:linear-gradient(180deg,var(--bg1),var(--bg2) 75%) fixed;color:var(--ink);font:16px/1.5 Outfit,system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.st{width:.95em;height:.95em;vertical-align:-.1em;display:inline-block;fill:currentColor;stroke:none}
.ic{width:1.05em;height:1.05em;vertical-align:-.18em;display:inline-block;stroke-width:2.4}
svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#app{margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 110px}
/* ---- header ---- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mini{font:900 21px/.86 'Big Shoulders Display',Impact,sans-serif;color:var(--gInk);letter-spacing:.01em}
.me{display:grid;justify-items:center;gap:3px;background:none;border:0;cursor:pointer;padding:0}
.avr{width:68px;height:68px;border-radius:50%;padding:4px;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--line) 0);transition:background .4s}
.av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:30px;overflow:hidden;background:var(--card2);border:2px solid var(--card)}
.av img{width:100%;height:100%;object-fit:cover}
.me small{font:700 13px Outfit,system-ui,sans-serif;white-space:nowrap}
.tb{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.streak{height:44px;padding:0 12px 0 8px;border-radius:999px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;gap:4px;font:800 17px Outfit,system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.streak .fl{font-size:22px;line-height:1;filter:grayscale(1);opacity:.5}
.streak.on .fl{filter:none;opacity:1;animation:flame 1.6s ease-in-out infinite}
.cb{width:46px;height:46px;border-radius:50%;background:var(--g);color:var(--onG);display:grid;place-items:center;border:0;cursor:pointer;box-shadow:0 4px 0 var(--gD);transition:transform .08s,box-shadow .08s}
.cb:active{transform:translateY(4px);box-shadow:0 0 0 var(--gD)}
.cb svg{width:24px;height:24px}
/* ---- buttons 3D ---- */
.btn{min-height:48px;padding:0 20px;border-radius:16px;border:0;background:var(--g);color:var(--onG);font:800 16px Outfit,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;box-shadow:0 4px 0 var(--gD);transition:transform .08s,box-shadow .08s;letter-spacing:.01em}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--gD)}
.btn.ghost{background:var(--card);color:var(--gInk);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.danger{background:var(--card);border:2px solid #e5484d;color:#e5484d;box-shadow:0 4px 0 #e5484d55}
.btn.sm{min-height:42px;font-size:15px;padding:0 14px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:20px;height:20px}
.lnk{background:none;border:0;color:var(--mut);font:700 15px Outfit,system-ui,sans-serif;text-decoration:underline;min-height:40px;cursor:pointer;padding:0 6px}
.play{display:flex;width:min(320px,100%);margin:12px auto 0;min-height:58px;font-size:22px;text-transform:uppercase;letter-spacing:.06em;border-radius:18px;box-shadow:0 5px 0 var(--gD)}
.play:active:not(:disabled){transform:translateY(5px)}
/* ---- modes ---- */

ex_ai:["🤖 Cet onglet utilise l’IA (Claude). Elle propose des lieux à partir de ses connaissances, sans GPS ni internet en direct : adresses, horaires et prix peuvent être faux. Vérifie sur Maps avant d’ajouter. Chaque analyse consomme un peu de ton quota Claude. Rien n’entre dans ton catalogue sans ton clic.", "🤖 This tab uses AI (Claude). It suggests places from what it knows, without GPS or live internet: addresses, hours and prices may be wrong. Check on Maps before adding. Each scan uses a bit of your Claude quota. Nothing enters your catalogue without your tap.", "🤖 Esta pestaña usa IA (Claude). Propone lugares según lo que sabe, sin GPS ni internet en directo: direcciones, horarios y precios pueden fallar. Verifica en Maps. Cada análisis usa un poco de tu cuota de Claude. Nada entra en tu catálogo sin tu toque.", "🤖 Dieser Tab nutzt KI (Claude). Sie schlägt Orte aus ihrem Wissen vor, ohne GPS und ohne Live-Internet: Adressen, Öffnungszeiten und Preise können falsch sein. Prüfe sie auf Maps. Jede Analyse verbraucht etwas von deinem Claude-Kontingent. Nichts landet ohne deinen Tipp im Katalog.", "🤖 Questa scheda usa l’IA (Claude). Propone locali in base a ciò che sa, senza GPS né internet in tempo reale: indirizzi, orari e prezzi possono essere sbagliati. Verifica su Maps prima di aggiungere. Ogni analisi usa un po’ della tua quota Claude. Nulla entra nel catalogo senza il tuo tocco.", "🤖 Este separador usa IA (Claude). Sugere locais com base no que sabe, sem GPS nem internet em tempo real: moradas, horários e preços podem estar errados. Verifica no Maps antes de adicionar. Cada análise usa um pouco da tua quota Claude. Nada entra no catálogo sem o teu toque.", "🤖 Здесь работает ИИ (Claude). Он предлагает места по своим знаниям, без GPS и интернета: адреса, часы и цены могут быть неточны. Проверяй в Картах. Каждый анализ тратит немного лимита Claude. Ничего не добавится без твоего нажатия.", "🤖 يستخدم هذا القسم الذكاء الاصطناعي (Claude). يقترح أماكن من معرفته، دون GPS أو إنترنت مباشر: قد تكون العناوين والمواعيد والأسعار خاطئة. تحقق على الخرائط قبل الإضافة. كل تحليل يستهلك قليلًا من حصتك في Claude. لا يُضاف شيء إلى قائمتك دون لمستك.", "🤖 此页面使用 AI（Claude）。它根据已有知识推荐店铺，没有 GPS 也不实时联网：地址、营业时间和价格可能有误。添加前请在地图上核实。每次分析会消耗少量 Claude 额度。未经你点击，不会加入菜单库。", "🤖 このタブはAI（Claude）を使います。GPSやリアルタイムのネットなしで知識から提案するため、住所・営業時間・価格が違う場合があります。追加前にMapsで確認を。分析ごとにClaudeの利用枠を少し使います。タップしない限りカタログには入りません。"],

s_starterpack_h:["Si activé, un nouveau catalogue vide se remplit avec Supermarché, Fast-food et Épicerie (générique, à toi de personnaliser).", "If on, an empty catalogue fills with Supermarket, Fast-food and Grocery (generic, yours to customise).", "Si está activo, un catálogo vacío se rellena con Supermercado, Comida rápida y Tienda (genérico, personalízalo).", "Wenn aktiviert, füllt sich ein leerer Katalog mit Supermarkt, Fast-Food und Lebensmittelladen (generisch, anpassbar).", "Se attivo, un catalogo vuoto si riempie con Supermercato, Fast-food ed Emporio (generico, personalizzabile).", "Se ativo, um catálogo vazio preenche-se com Supermercado, Fast-food e Mercearia (genérico, personalizável).", "Если включено, пустой каталог заполняется Супермаркетом, Фастфудом и Магазином (общее, настрой под себя).", "عند التفعيل، يمتلئ الكتالوج الفارغ بسوبر ماركت ووجبات سريعة وبقالة (عام، خصّصه كما تشاء).", "开启后，空目录会自动填入超市、快餐和便利店（通用内容，可自行调整）。", "オンにすると、空のカタログにスーパー・ファストフード・コンビニ（汎用、カスタマイズ可）が自動で入ります。"],

ob_1_d:["Plus besoin de te demander où manger : l'appli tire au sort un lieu et un plat pour toi — un peu comme un ticket à gratter.", "No more wondering what to eat: the app picks a place and a dish for you — a bit like a scratch card.", "Ya no tienes que pensar qué comer: la app sortea un lugar y un plato para ti, un poco como un rasca y gana.", "Keine Lust mehr zu überlegen, was es gibt: Die App würfelt einen Ort und ein Gericht für dich aus – ein bisschen wie ein Rubbellos.", "Basta chiedersi cosa mangiare: l'app sorteggia un locale e un piatto per te, un po' come un gratta e vinci.", "Chega de pensar no que comer: a app sorteia um local e um prato para ti, um pouco como uma raspadinha.", "Больше не нужно думать, что поесть: приложение само выбирает место и блюдо — немного как лотерейный билет.", "لا داعي للتساؤل عن ماذا ستأكل: التطبيق يختار لك مكانًا وطبقًا بالقرعة، كأنه بطاقة خدش وربح.", "不用再纠结吃什么：应用会为你随机抽取地点和菜品——有点像刮刮乐。", "何を食べるか悩まなくてOK：アプリが場所と料理をランダムに選びます。スクラッチくじのような感覚です。"],
ob_2_t:["Un tirage à chaque moment", "One draw per moment", "Un sorteo por cada momento", "Ein Zug pro Tageszeit", "Un'estrazione per ogni momento", "Um sorteio por cada momento", "Один розыгрыш на каждый приём пищи", "سحب واحد لكل وقت", "每个时段一次抽取", "時間帯ごとに1回の抽選"],
ob_2_d:["Petit-déjeuner, midi, goûter, soir : un tirage gratuit à chaque fois. Pas content ? Une relance gratuite par jour, sinon ça coûte quelques pièces.", "Breakfast, lunch, snack, dinner: one free draw each time. Not happy? One free reroll a day, then it costs a few coins.", "Desayuno, comida, merienda, cena: un sorteo gratis cada vez. ¿No te convence? Una repetición gratis al día, luego cuesta unas monedas.", "Frühstück, Mittag, Snack, Abend: jedes Mal ein kostenloser Zug. Nicht zufrieden? Ein kostenloser Neuversuch pro Tag, danach kostet es ein paar Münzen.", "Colazione, pranzo, merenda, cena: un'estrazione gratuita ogni volta. Non ti piace? Un rilancio gratis al giorno, poi costa qualche moneta.", "Pequeno-almoço, almoço, lanche, jantar: um sorteio grátis de cada vez. Não gostaste? Uma repetição grátis por dia, depois custa umas moedas.", "Завтрак, обед, перекус, ужин: бесплатный розыгрыш каждый раз. Не понравилось? Один бесплатный повтор в день, потом за монеты.", "الفطور والغداء والوجبة الخفيفة والعشاء: سحب مجاني في كل مرة. لم يعجبك؟ إعادة مجانية واحدة يوميًا، ثم تكلّف بضع عملات.", "早餐、午餐、点心、晚餐：每次都有一次免费抽取。不满意？每天一次免费重抽，之后需要花金币。", "朝食・昼食・おやつ・夕食、それぞれ1回無料で抽選。気に入らない時は1日1回無料でやり直し、それ以降はコインが必要です。"],

ob_3_d:["Comme à la loterie : la plupart des tirages sont courants, certains sont spéciaux, et de temps en temps, un tirage doré et rare !", "Like a lottery: most draws are common, some are special, and once in a while, a rare golden draw!", "Como en la lotería: la mayoría son comunes, otros son especiales, y de vez en cuando, ¡uno dorado y raro!", "Wie bei einer Lotterie: die meisten Züge sind häufig, manche besonders, und ab und zu ein seltener, goldener Zug!", "Come alla lotteria: la maggior parte sono comuni, alcune speciali, e ogni tanto una rara e dorata!", "Como na lotaria: a maioria são comuns, alguns especiais, e de vez em quando, um raro e dourado!", "Как в лотерее: большинство обычные, некоторые особые, а иногда — редкий золотой!", "كما في اليانصيب: معظم السحوبات شائعة، وبعضها خاص، ومن حين لآخر سحب ذهبي نادر!", "就像彩票一样：大多数是普通的，有些是特殊的，偶尔还会抽到稀有的金色奖励！", "宝くじのように、ほとんどは普通ですが、たまに特別な、そして稀に金色のレアな結果も！"],

ob_4_d:["Chaque tirage rapporte de l'expérience et des pièces. Reviens tous les jours pour garder ta série en cours et débloquer des récompenses.", "Each draw earns experience and coins. Come back daily to keep your streak going and unlock rewards.", "Cada sorteo da experiencia y monedas. Vuelve cada día para mantener tu racha y desbloquear recompensas.", "Jeder Zug bringt Erfahrung und Münzen. Komm jeden Tag wieder, um deine Serie zu halten und Belohnungen freizuschalten.", "Ogni estrazione dà esperienza e monete. Torna ogni giorno per mantenere la serie e sbloccare ricompense.", "Cada sorteio dá experiência e moedas. Volta todos os dias para manter a sequência e desbloquear recompensas.", "Каждый розыгрыш даёт опыт и монеты. Возвращайся каждый день, чтобы сохранить серию и открыть награды.", "كل سحب يمنحك خبرة وعملات. عد كل يوم للحفاظ على سلسلتك وفتح المكافآت.", "每次抽取都能获得经验和金币。每天回来保持连胜并解锁奖励。", "抽選するたびに経験値とコインがもらえます。毎日続けて連続記録を保ち、報酬を解除しましょう。"],

ex_osm:["📡 Cet onglet utilise OpenStreetMap (données réelles et gratuites) autour de ta position : lieux réels, mais menus estimés à corriger toi-même. Rien n’entre dans ton catalogue sans ton clic.", "📡 This tab uses OpenStreetMap (real, free data) around your location: real places, but estimated menus you should correct yourself. Nothing enters your catalogue without your tap.", "📡 Esta pestaña usa OpenStreetMap (datos reales y gratuitos) cerca de tu posición: lugares reales, pero menús estimados que debes corregir tú. Nada entra en tu catálogo sin tu toque.", "📡 Dieser Tab nutzt OpenStreetMap (echte, kostenlose Daten) rund um deinen Standort: echte Orte, aber geschätzte Speisekarten, die du selbst anpassen solltest. Nichts landet ohne deinen Tipp im Katalog.", "📡 Questa scheda usa OpenStreetMap (dati reali e gratuiti) intorno alla tua posizione: locali reali, ma menu stimati da correggere tu stesso. Nulla entra nel catalogo senza il tuo tocco.", "📡 Este separador usa o OpenStreetMap (dados reais e gratuitos) perto da tua localização: locais reais, mas menus estimados que deves corrigir tu. Nada entra no catálogo sem o teu toque.", "📡 Здесь используются данные OpenStreetMap (реальные и бесплатные) рядом с твоим местоположением: настоящие места, но примерное меню, которое стоит подправить самому. Ничего не добавится без твоего нажатия.", "📡 يستخدم هذا القسم بيانات OpenStreetMap (حقيقية ومجانية) حول موقعك: أماكن حقيقية، لكن قوائم طعام تقديرية يجب عليك تصحيحها. لا يُضاف شيء إلى قائمتك دون لمستك.", "📡 此页面使用 OpenStreetMap（真实免费数据）获取你附近的地点：地点真实存在，但菜单是估算的，需要你自行修正。未经你点击，不会加入菜单库。", "📡 このタブは現在地周辺のOpenStreetMap（実在・無料のデータ）を使います。場所は実在しますが、メニューは概算なので自分で修正してください。タップしない限りカタログには入りません。"],

function haversine(lat1,lon1,lat2,lon2){const R=6371000,toRad=d=>d*Math.PI/180;const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

async function overpassScan(x,m){
  const [la,lo]=x.coords.map(Number),rad=+x.radius;
  const or_=Object.entries(OSM_TAGS).map(([,[k,v]])=>`node["${k}"="${v}"](around:${rad},${la},${lo});`).join('');
  const q=`[out:json][timeout:25];(${or_});out body center 60;`;
  const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),signal:scan.ctl.signal});
  if(!res.ok)throw new Error('overpass_http');
  const data=await res.json();
  const names=S.places.map(p=>p.name.trim().toLowerCase());
  const seen=new Set();
  const list=(data.elements||[]).filter(el=>el.tags&&el.tags.name).map(el=>{
    const key=Object.keys(OSM_TAGS).find(k=>{const[tk,tv]=OSM_TAGS[k];return el.tags[tk]==tv});
    const info=OSM_INFO[key]||OSM_INFO.restaurant;
    const dist=Math.round(haversine(la,lo,el.lat,el.lon));
    return {name:el.tags.name,emoji:info.emoji,type:info.label,address:[el.tags['addr:housenumber'],el.tags['addr:street']].filter(Boolean).join(' ')||'',
      dist,price:info.rank=='A'?2:1,rank:info.rank,conf:'moyenne',why:'',
      items:info.items.map(([cat,name,price,rank,emoji])=>({name,cat,price,rank,emoji})),_d:dist}})
    .filter(p=>{const k=p.name.trim().toLowerCase();if(seen.has(k)||names.includes(k))return false;seen.add(k);return true})
    .sort((a,b)=>a._d-b._d).slice(0,10);
  return list}

    g.coins-=p;if(v=='freeze')g.freeze=(g.freeze||0)+1;else if(v=='rr')g.rrBonus=(g.rrBonus||0)+1;else if(v=='boost')g.boost=(g.boost||0)+1;else if(v=='gold'||v=='rain'){g.frames=g.frames||[];if(!g.frames.includes(v))g.frames.push(v);g.frame=v}
    g.stats.buys=(g.stats.buys||0)+1;const ach=checkAch();save();SFX.yes();toast(v=='pity'?t('t_spark'):t('t_bought'));if(ach.length){confetti(80);SFX.level()}applyFrame();hdr();shopSheet()},
  equip:b=>{S.game.frame=b.dataset.v;save();SFX.soft();applyFrame();shopSheet()},

  skip:()=>{SFX.soft();if(seq.multi){seq.still=false;seq.stage='recap';ovRender();return}seq.i=seq.steps.length-1;ovRender()},
  closeov:()=>{SFX.tap();if(seq.multi){const rs=seq.list.slice().reverse().map(e=>reward(e)).filter(Boolean);if(!rs.length)return A.rewclose();rewardScreen({before:rs[0].before,after:S.game.xp,done:rs.flatMap(r=>r.done),ach:rs.flatMap(r=>r.ach),streak:rs[rs.length-1].streak,up:rs.some(r=>r.up),best:bestOf(rs.map(r=>r.best)),coins:rs.reduce((s,r)=>s+r.coins,0),froze:rs.some(r=>r.froze)});return}const r=reward(seq.e);if(r){rewardScreen(r)}else A.rewclose()},
  rewclose:()=>{if(window.__reload){location.reload();return}ov.hidden=true;ov.innerHTML='';document.body.style.overflow='';seq=null;view='home';render();scrollTo(0,0)}
};

let drag=null,tiltRAF=0;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('#pack,#flip,#bst');if(!el||e.button>0)return;if(e.target.closest('.tchip'))return;drag={el,x:e.clientX,y:e.clientY,moved:false,ripLast:0};try{el.setPointerCapture(e.pointerId)}catch(_){}if(el.id=='bst')el.classList.add('drag')});
document.addEventListener('pointermove',e=>{
  if(!drag){const b=e.pointerType=='mouse'&&e.target.closest&&e.target.closest('#bst');if(!b||reduce||tiltRAF)return;tiltRAF=requestAnimationFrame(()=>{tiltRAF=0;const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;b.style.setProperty('--ry',(x-.5)*14+'deg');b.style.setProperty('--rx',(.5-y)*14+'deg');b.style.setProperty('--fx',x*100+'%');b.style.setProperty('--fy',y*100+'%')});return}
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;const el=drag.el;
  if(el.id=='bst'){el.style.setProperty('--sx',dx*.6+'px');el.style.setProperty('--sy',Math.min(0,dy)*.6+'px');el.style.setProperty('--fx',50+dx/4+'%')}
  else if(el.id=='pack'&&!el.classList.contains('open')){const p=Math.max(0,Math.min(1,Math.max(Math.abs(dx),-dy)/(el.offsetWidth*.85)));el.style.setProperty('--cut',p.toFixed(3));if(p-drag.ripLast>.08){drag.ripLast=p;SFX.rip(p);vib(5)}if(p>=1){suppress=Date.now()+400;drag=null;tear(el)}}
  else if(el.id=='flip'){el.style.transform=`translateX(${dx*.5}px) rotate(${dx*.03}deg)`}
});
function endDrag(e){if(!drag)return;const d=drag;drag=null;const dx=e.clientX-d.x,dy=e.clientY-d.y,el=d.el;
  if(d.moved)suppress=Date.now()+350;
  if(el.id=='bst'){el.classList.remove('drag');el.style.setProperty('--sx','0px');el.style.setProperty('--sy','0px');if(!d.moved)return;
    if(dy<-70&&Math.abs(dy)>Math.abs(dx)){SFX.swipe();openBooster()}else if(Math.abs(dx)>70)switchMode(dx<0?1:-1)}
  else if(el.id=='pack'){if(el.classList.contains('open'))return;const p=+getComputedStyle(el).getPropertyValue('--cut')||0;if(p>.55)tear(el);else el.style.setProperty('--cut',0)}
  else if(el.id=='flip'){el.style.transform='';if(!d.moved)return;if(dx<-60||dy<-60){if(el.classList.contains('on')){const nx=$('#nx');if(nx&&!nx.disabled)goNext()}else flipCard(el)}}}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('pointerout',e=>{const b=e.target.closest&&e.target.closest('#bst');if(b&&!drag&&!b.contains(e.relatedTarget)){b.style.setProperty('--rx','0deg');b.style.setProperty('--ry','0deg')}});
document.addEventListener('input',e=>{
  if(e.target.id=='fEmo'&&draft&&!draft.img){$('#pv').innerHTML=icon(e.target.value,null);return}
  const f=e.target.dataset.f;if(!f)return;const v=e.target.value,s=S.settings;

  if(f=='cur'){S.settings.cur=v;save();render();return}

  if(f=='sound'||f=='vibe')s[f]=e.target.checked;else if(f=='starterPack'){s.starterPack=e.target.checked;if(s.starterPack&&!S.places.length){S.places=starterPlaces();S.items=starterItems();toast(t('t_starteron'));render()}}else if(f=='volume')s.volume=+v;else if(f=='pseudo')s.pseudo=v;else if(f=='avatar')s.avatar=v||'😋';
  else if(f.startsWith('hour:')){if(v){s.hours[f.slice(5)]=v;applyTheme()}}
  else if(f.startsWith('x:')){s.explore[f.slice(2)]=v;if(f=='x:origin')delete s.explore.coords}
  else if(f.startsWith('rate:'))s.rates[f.slice(5)]=Math.max(0,+v||0);
  else if(f=='pityA'||f=='pityS'){if(v!=='')s[f]=Math.max(1,Math.round(+v||1))}
  else if(f.startsWith('p:')){const [,id,k]=f.split(':');const pl=S.places.find(x=>x.id==id);if(pl)pl[k]=k=='weight'?Math.max(0,+v||0):v}
  save();updPct();hdr();
});

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d20">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarpaing Faim">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Tarpaing Faim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
<style>
/* VOICE: gacha de cour de récré, gamifié façon appli d'apprentissage, punchy et lisible en 2 secondes.
   IDEA: un booster de cartes à collectionner + une mascotte brioche affamée (Tarpi) qui réagit aux tirages.
   PICTURE: booster qui se déchire au swipe, cartes qui se retournent, pluie de confettis, XP qui grimpe.
   COLOUR and TYPE: accent par ambiance (orange aube, bleu roi midi, framboise goûter, vert néon nuit), rangs bleu/violet/or. Outfit + Big Shoulders.
   LAYOUT: colonne mobile 480px, accueil qui tient sur un écran, boutons 3D, tab bar à icônes duotone. */
:root{--bg1:#e4f3e8;--bg2:#f7fbf8;--ink:#0b1a10;--mut:#56685b;--card:#fff;--card2:#eef4ef;--line:#d3e2d6;--g:#22b35a;--gD:#178a43;--onG:#fff;--gInk:#13843b;--nav:#fff;--ov1:#ffffff;--ov2:#cdead5;--ovInk:#0b1a10;--ovRow:#ffffff;color-scheme:light}
:root[data-theme=dark]{--bg1:#0f3d20;--bg2:#040a06;--ink:#f2f7f3;--mut:#9db6a5;--card:#0a130d;--card2:#13221a;--line:#1f3527;--g:#35d16b;--gD:#1f9447;--onG:#06140a;--gInk:#3ad46f;--nav:#000;--ov1:#174428;--ov2:#020604;--ovInk:#fff;--ovRow:rgba(255,255,255,.07);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#0f3d20;--bg2:#040a06;--ink:#f2f7f3;--mut:#9db6a5;--card:#0a130d;--card2:#13221a;--line:#1f3527;--g:#35d16b;--gD:#1f9447;--onG:#06140a;--gInk:#3ad46f;--nav:#000;--ov1:#174428;--ov2:#020604;--ovInk:#fff;--ovRow:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-cycle=matin]{--bg1:#ffd9b8;--bg2:#fff6ec;--ink:#2a1a0e;--mut:#7a5e48;--card:#fffaf4;--card2:#fbeee0;--line:#f0d9c2;--g:#f26b1d;--gD:#c24f0d;--onG:#fff;--gInk:#c4500f;--nav:#fffaf4;--ov1:#fffaf4;--ov2:#ffd9b8;--ovInk:#2a1a0e;--ovRow:#fff}
:root[data-cycle=midi]{--bg1:#74c3f5;--bg2:#eaf6ff;--ink:#0b1f33;--mut:#4c6a85;--card:#fff;--card2:#eef6fd;--line:#cfe3f3;--g:#1e6fe0;--gD:#1553ad;--onG:#fff;--gInk:#1553ad;--nav:#fff;--ov1:#fff;--ov2:#a9dcfb;--ovInk:#0b1f33;--ovRow:#fff}
:root[data-cycle=gouter]{--bg1:#ffb3b8;--bg2:#fff1e6;--ink:#2b140f;--mut:#80594c;--card:#fffaf6;--card2:#fdeee6;--line:#f3d6c8;--g:#e3406b;--gD:#ad284d;--onG:#fff;--gInk:#ad284d;--nav:#fffaf6;--ov1:#fffaf6;--ov2:#ffc9a8;--ovInk:#2b140f;--ovRow:#fff}
:root[data-cycle=soir]{--bg1:#1d2a6b;--bg2:#05071a;--ink:#eef1ff;--mut:#9aa3d6;--card:#0c1030;--card2:#151a45;--line:#262c66;--g:#35d16b;--gD:#1f9447;--onG:#06140a;--gInk:#3ad46f;--nav:#04061a;--ov1:#1f2c75;--ov2:#02030f;--ovInk:#fff;--ovRow:rgba(255,255,255,.07)}
:root[data-cycle] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;will-change:transform}
:root[data-cycle=matin] body::before{background:radial-gradient(circle at 86% 5%,#fff3c4 0 34px,rgba(255,200,120,.55) 36px,transparent 190px)}
:root[data-cycle=midi] body::before{background:radial-gradient(circle at 90% 4%,#fff7b0 0 26px,rgba(255,240,150,.5) 28px,transparent 120px),radial-gradient(70px 24px at 16% 9%,rgba(255,255,255,.95),transparent 72%),radial-gradient(100px 32px at 26% 11%,rgba(255,255,255,.85),transparent 72%),radial-gradient(90px 28px at 68% 19%,rgba(255,255,255,.9),transparent 72%),radial-gradient(120px 36px at 78% 21%,rgba(255,255,255,.75),transparent 72%);animation:drift 40s ease-in-out infinite alternate}
:root[data-cycle=gouter] body::before{background:radial-gradient(circle at 12% 6%,#ffe7b8 0 30px,rgba(255,170,110,.5) 32px,transparent 200px)}
:root[data-cycle=soir] body::before{background:radial-gradient(circle at 86% 6%,#fffbe6 0 18px,rgba(255,250,220,.25) 19px,transparent 70px),radial-gradient(1.5px 1.5px at 10% 12%,#fff,transparent),radial-gradient(1px 1px at 22% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 35% 8%,#fff,transparent),radial-gradient(1px 1px at 48% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 4%,#fff,transparent),radial-gradient(1px 1px at 70% 28%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 26%,#fff,transparent),radial-gradient(1px 1px at 5% 40%,#fff,transparent),radial-gradient(1px 1px at 96% 50%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 46%,#fff,transparent);animation:twinkle 4s ease-in-out infinite}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html.paused *,html.paused *::before,html.paused *::after{animation-play-state:paused!important}
body{margin:0;min-height:100dvh;background:linear-gradient(180deg,var(--bg1),var(--bg2) 75%) fixed;color:var(--ink);font:16px/1.5 Outfit,system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:480px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 110px}
/* ---- header ---- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mini{font:900 21px/.86 'Big Shoulders Display',Impact,sans-serif;color:var(--gInk);letter-spacing:.01em}
.me{display:grid;justify-items:center;gap:3px;background:none;border:0;cursor:pointer;padding:0}
.avr{width:68px;height:68px;border-radius:50%;padding:4px;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--line) 0);transition:background .4s}
.av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:30px;overflow:hidden;background:var(--card2);border:2px solid var(--card)}
.av img{width:100%;height:100%;object-fit:cover}
.me small{font:700 13px Outfit,system-ui,sans-serif;white-space:nowrap}
.tb{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.streak{height:44px;padding:0 12px 0 8px;border-radius:999px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;gap:4px;font:800 17px Outfit,system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.streak .fl{font-size:22px;line-height:1;filter:grayscale(1);opacity:.5}
.streak.on .fl{filter:none;opacity:1;animation:flame 1.6s ease-in-out infinite}
.cb{width:46px;height:46px;border-radius:50%;background:var(--g);color:var(--onG);display:grid;place-items:center;border:0;cursor:pointer;box-shadow:0 4px 0 var(--gD);transition:transform .08s,box-shadow .08s}
.cb:active{transform:translateY(4px);box-shadow:0 0 0 var(--gD)}
.cb svg{width:24px;height:24px}
/* ---- buttons 3D ---- */
.btn{min-height:48px;padding:0 20px;border-radius:16px;border:0;background:var(--g);color:var(--onG);font:800 16px Outfit,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;box-shadow:0 4px 0 var(--gD);transition:transform .08s,box-shadow .08s;letter-spacing:.01em}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--gD)}
.btn.ghost{background:var(--card);color:var(--gInk);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.danger{background:var(--card);border:2px solid #e5484d;color:#e5484d;box-shadow:0 4px 0 #e5484d55}
.btn.sm{min-height:42px;font-size:15px;padding:0 14px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:20px;height:20px}
.lnk{background:none;border:0;color:var(--mut);font:700 15px Outfit,system-ui,sans-serif;text-decoration:underline;min-height:40px;cursor:pointer;padding:0 6px}
.play{display:flex;width:min(320px,100%);margin:12px auto 0;min-height:58px;font-size:22px;text-transform:uppercase;letter-spacing:.06em;border-radius:18px;box-shadow:0 5px 0 var(--gD)}
.play:active:not(:disabled){transform:translateY(5px)}
/* ---- modes ---- */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:4px;margin-top:10px}
.modes button{border:0;background:none;border-radius:13px;min-height:50px;display:grid;place-items:center;align-content:center;gap:1px;font:700 12.5px/1.1 Outfit,system-ui,sans-serif;color:var(--ink);cursor:pointer;transition:background .2s,transform .15s}
.modes button span{font-size:20px;line-height:1}
.modes button.on{background:var(--g);color:var(--onG);box-shadow:0 3px 0 var(--gD);transform:translateY(-1px)}
.mhint{text-align:center;font-size:12.5px;color:var(--mut);margin:5px 0 0;min-height:18px}
.mhint .lnk{font-size:12.5px;min-height:24px;padding:0}
/* ---- booster ---- */
.hero{--ch:clamp(270px,calc(100dvh - 455px),470px);position:relative;display:grid;place-items:center;padding:10px 0 2px}
.hero::before{content:"";position:absolute;width:92%;aspect-ratio:1;top:2%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 45%,transparent),transparent 62%);animation:pulse 3.6s ease-in-out infinite;pointer-events:none}
.bwrap{position:relative;animation:float 4.2s ease-in-out infinite}
.bst{position:relative;height:var(--ch);width:min(78vw,calc(var(--ch)*.69));border-radius:22px;background:#000;overflow:hidden;display:flex;flex-direction:column;color:#fff;border:0;padding:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transform:translate(var(--sx,0),var(--sy,0)) perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) rotate(calc(var(--sx,0px)*.04deg));transition:transform .3s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 26px 46px -14px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.07)}
.bst.drag{transition:none}
.bst.f{box-shadow:0 26px 46px -14px rgba(0,0,0,.6),0 0 0 3px var(--c),0 0 40px color-mix(in srgb,var(--c) 70%,transparent)}
.bst.enter-l{animation:enterL .45s cubic-bezier(.2,.9,.3,1.2)}.bst.enter-r{animation:enterR .45s cubic-bezier(.2,.9,.3,1.2)}
.bhd{height:15%;flex:none;display:grid;place-items:center}
.logo{font:900 calc(var(--ch,420px)*.068)/.85 'Big Shoulders Display',Impact,sans-serif;text-align:center;color:#fff;white-space:nowrap}
.logo small{display:block;font:600 10px Outfit,system-ui,sans-serif;letter-spacing:.38em;margin-top:5px}
.bart{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.burst{position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,255,255,.12) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle at 50% 42%,#000 10%,transparent 55%);mask:radial-gradient(circle at 50% 42%,#000 10%,transparent 55%);animation:spin 40s linear infinite;will-change:transform}
.foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 22%,rgba(255,236,190,.55) 40%,rgba(255,255,255,.08) 50%,rgba(255,214,150,.45) 60%,transparent 78%);background-size:250% 250%;background-position:var(--fx,30%) var(--fy,30%)}
.plate{position:relative;width:44%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--ch)*.13);background:radial-gradient(circle at 40% 32%,#fff,#fff1e3 58%,#f1c59b);box-shadow:0 12px 24px rgba(0,0,0,.35),inset 0 -6px 0 rgba(0,0,0,.08),0 0 0 6px rgba(255,255,255,.22)}
.plate span{transition:transform .35s,opacity .35s}
.plate span.out{transform:scale(.3) rotate(-40deg);opacity:0}
.orb{position:absolute;font-size:calc(var(--ch)*.065);animation:orb 3.4s ease-in-out infinite}
.bttl{position:relative;font:800 calc(var(--ch)*.08)/.92 Outfit,system-ui,sans-serif;text-transform:uppercase;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.3);padding:0 8px}
.bsub{position:relative;font:700 12px Outfit,system-ui,sans-serif;background:rgba(0,0,0,.3);padding:3px 12px;border-radius:999px}
.rib{position:absolute;top:18px;right:-40px;z-index:3;transform:rotate(38deg);background:var(--c);color:#fff;font:800 12px Outfit,system-ui,sans-serif;text-transform:uppercase;padding:5px 46px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.bft{height:12%;flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px}
.tchip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px 0 5px;border-radius:999px;background:#1c1c1c;border:1px solid #333;font:700 12.5px Outfit,system-ui,sans-serif;color:#fff}
.tchip svg{width:19px;height:19px}
.pips{display:flex;align-items:center;gap:3px;font:700 11px Outfit,system-ui,sans-serif;color:#bbb}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--c);margin-left:3px}
.nb{font:900 17px 'Big Shoulders Display',Impact,sans-serif;color:#777}
.swh{text-align:center;font:600 12px Outfit,system-ui,sans-serif;color:var(--mut);margin:6px 0 0}
/* ---- budget compact ---- */
.bud{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.bstep{display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 3px 0 var(--line)}
.bstep>button:not(.bval){width:40px;height:40px;border-radius:50%;border:0;background:var(--g);color:var(--onG);font:800 22px/1 Outfit,system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--gD)}
.bstep>button:not(.bval):active{transform:translateY(3px);box-shadow:none}
.bval{min-width:140px;border:0;background:none;cursor:pointer;text-align:center;font:800 19px/1.05 Outfit,system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 4px}
.bval small{display:block;font:600 11px Outfit,system-ui,sans-serif;color:var(--mut)}
.bhint{margin:6px 0 0;font-size:12.5px;color:var(--mut);text-align:center}
.bhint.bad{color:#e5484d;font-weight:700}
.bpre{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bpre button,.mchip{height:40px;min-width:54px;padding:0 13px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:700 14px Outfit,system-ui,sans-serif;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.bpre button.on{background:var(--g);border-color:var(--g);color:var(--onG)}
.bpre.l{justify-content:flex-start}
/* ---- cards / sections ---- */
.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.sec{margin-top:22px}
h1{font:800 30px/1.05 Outfit,system-ui,sans-serif;margin:0}
h2{font:800 19px/1.2 Outfit,system-ui,sans-serif;margin:0 0 10px}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ph h2{margin:0}
.ib{width:42px;height:42px;flex:none;border-radius:12px;border:0;background:transparent;color:var(--mut);display:grid;place-items:center;cursor:pointer;font:800 13px Outfit,system-ui,sans-serif}
.ib svg{width:22px;height:22px}
.ib.warn{background:#e5484d;color:#fff}
.quest{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0}
.quest+.quest{border-top:2px solid var(--line)}
.qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--card2)}
.quest.done .qi{background:var(--g);box-shadow:0 3px 0 var(--gD)}
.quest b{font-weight:700;font-size:15px;display:block}
.qb{height:12px;border-radius:9px;background:var(--card2);margin-top:5px;overflow:hidden}
.qb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g),color-mix(in srgb,var(--g) 60%,#fff));transition:width .6s cubic-bezier(.2,.9,.3,1)}
.qx{font:800 13px Outfit,system-ui,sans-serif;color:var(--gInk);white-space:nowrap}
.prw{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center}
.prw+.prw{margin-top:14px}
.rkb{width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font:900 22px Outfit,system-ui,sans-serif;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000)}
.prt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prt small{color:var(--c)}
.prt em{font-style:normal;font-weight:800;color:var(--c);white-space:nowrap;font-size:14px}
.pp{display:grid;gap:4px;margin:6px 0 3px}
.pp i{height:10px;border-radius:9px;background:var(--card2);border:1px solid var(--line)}
.pp i.on{background:var(--c);border-color:var(--c)}
.pp i.g{border:2px dashed var(--c)}
.pbar{height:10px;border-radius:9px;background:var(--card2);margin:6px 0 3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
.pc{color:var(--mut);font-size:13px}
.lastm{width:100%;margin-top:12px;display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--card);border:2px solid var(--line);cursor:pointer;text-align:left;color:var(--ink)}
.lastm strong{white-space:nowrap}
.rb{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 7px;border-radius:999px;font:800 13px Outfit,system-ui,sans-serif;color:#fff;background:var(--c)}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;background:var(--card);border:2px solid var(--line);margin-bottom:8px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 72px}
.ico{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 24%,transparent);overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.ico.xl{width:96px;height:96px;font-size:58px;border-radius:22px;box-shadow:0 0 0 3px var(--c)}
.rm{flex:1;display:grid}
.rm b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm small{color:var(--mut);font-size:13.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips button{flex:none;height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:700 14px Outfit,system-ui,sans-serif;cursor:pointer}
.chips button.on{border-color:var(--g);background:var(--g);color:var(--onG)}
.grp{display:flex;align-items:center;gap:8px;font:800 18px Outfit,system-ui,sans-serif;margin:20px 0 8px}
.grp em{margin-left:auto;font:600 13px Outfit,system-ui,sans-serif;color:var(--mut);font-style:normal}
.note,.hint2{color:var(--mut);font-size:14px;margin:6px 0 10px}
.empty{color:var(--mut);text-align:center;padding:20px 0}
.fld{display:grid;gap:6px;font:700 14px Outfit,system-ui,sans-serif;color:var(--mut);margin-bottom:14px}
input,select,textarea{width:100%;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--ink);font-size:16px;padding:0 12px}
textarea{height:auto;padding:10px 12px;resize:vertical;margin:8px 0}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--g);height:32px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--ink);font:700 14px Outfit,system-ui,sans-serif;cursor:pointer;padding:2px 4px}
.seg button.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 20%,var(--card2))}

.emog{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;margin-bottom:8px}

.emog button.on{border-color:var(--g)}
.iconrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconrow input{width:76px;text-align:center;font-size:22px}
.file{position:relative}
.prev{display:grid;place-items:center;margin:4px 0 16px}
.sact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.sact .danger{margin-right:auto}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;animation:fade .2s}
.pan{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);max-height:92dvh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.9,.3,1.1)}
.sub{font:800 15px Outfit,system-ui,sans-serif;color:var(--mut);margin:16px 0 6px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.prof{display:flex;gap:14px;align-items:flex-start}
.grow{flex:1}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) 62px 66px;gap:6px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.prow .em{text-align:center;font-size:22px;padding:0}
.prow .num,.rate input{text-align:right}
.prow .pct{grid-column:1/4;font:600 13px Outfit,system-ui,sans-serif;color:var(--mut)}
.prow .ib{grid-column:4;justify-self:end}
.pmodes{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pmodes button{height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card2);font-size:18px;cursor:pointer;opacity:.4;filter:grayscale(1)}
.pmodes button.on{opacity:1;filter:none;border-color:var(--g);background:color-mix(in srgb,var(--g) 18%,var(--card2))}
.rates{display:grid;gap:8px}
.rate{display:grid;grid-template-columns:minmax(0,1fr) 80px 64px;gap:8px;align-items:center;font-weight:700;color:var(--c)}
.rate b{color:var(--mut);text-align:right;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.langs button{min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card2);font:700 15px Outfit,system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ink)}
.langs button.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 18%,var(--card2));box-shadow:0 3px 0 var(--gD)}
.langs span{font-size:20px}
.sw{display:flex;justify-content:space-between;align-items:center;min-height:50px;gap:12px;cursor:pointer;font-weight:700;position:relative}
.sw small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{flex:none;width:54px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--g)}.sw input:checked+i::after{transform:translateX(22px)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 10px;display:grid}
.stats b{font:800 clamp(17px,5vw,23px)/1.1 Outfit,system-ui,sans-serif;white-space:nowrap}
.stats small{color:var(--mut);font-size:12.5px}
.bar{display:grid;grid-template-columns:minmax(0,9em) 1fr 28px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{position:relative;height:12px;border-radius:9px;background:var(--card2)}
.trk i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--c)}
.trk u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.bar b{text-align:right}
.hrow{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;content-visibility:auto;contain-intrinsic-size:auto 120px}
.hh{display:flex;align-items:center;gap:8px}
.hh time{margin-left:auto;color:var(--mut);font-size:13px;white-space:nowrap}
.hi{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:999px;font-size:14px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1.5px solid var(--c)}
.tag .ti{width:22px;height:22px;border-radius:50%;object-fit:cover;font-size:16px;display:grid;place-items:center}
.hf{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px}
.hf b{color:var(--ink);margin-left:auto}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ach{border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;background:var(--card2);display:grid;gap:2px;justify-items:center}
.ach span{font-size:30px;line-height:1.1}
.ach b{font-size:12.5px;line-height:1.15}
.ach small{font-size:11px;color:var(--mut);line-height:1.2}
.ach.lock{opacity:.45;filter:grayscale(1)}
.ach.got{border-color:var(--g);box-shadow:0 3px 0 var(--gD)}
.xpline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font:800 14px Outfit,system-ui,sans-serif}
.xpb{height:16px;border-radius:9px;background:var(--card2);overflow:hidden;border:2px solid var(--line)}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,#ffc83d,#ff9a1f);border-radius:9px}
.aib{display:inline-grid;place-items:center;vertical-align:middle;height:26px;padding:0 9px;border-radius:8px;background:linear-gradient(135deg,#a55cf2,#3f8cff);color:#fff;font:800 13px Outfit,system-ui,sans-serif}
.ainote{border:2px dashed #a55cf2;background:color-mix(in srgb,#a55cf2 10%,var(--card));border-radius:18px;padding:12px 14px;font-size:14px;margin-bottom:14px;line-height:1.45}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
.xr{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;animation:rise .4s both}
.xh{display:flex;align-items:center;gap:12px}
.xa,.xw{margin:8px 0 0;font-size:14px;color:var(--mut)}.xw{color:var(--ink)}
.xf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}.xf .btn{margin-left:auto}
.conf{font:700 12px Outfit,system-ui,sans-serif;padding:3px 9px;border-radius:999px;background:var(--card2)}
.c-haute{color:#13843b}.c-moyenne{color:#b7791f}.c-faible{color:#e5484d}
.iab{font:800 11px Outfit,system-ui,sans-serif;color:#a55cf2}
/* ---- tab bar ---- */
.tab{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--nav);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tab button{background:none;border:0;color:var(--mut);height:56px;display:grid;place-items:center;cursor:pointer;border-radius:14px;position:relative}
.tab svg{width:30px;height:30px;stroke-width:2}
.tab svg .d{fill:currentColor;opacity:0;transition:opacity .2s}
.tab button.on{color:var(--g)}
.tab button.on svg .d{opacity:.28}
.tab button.on::after{content:"";position:absolute;inset:4px 10px;border-radius:12px;border:2px solid color-mix(in srgb,var(--g) 40%,transparent);background:color-mix(in srgb,var(--g) 10%,transparent);z-index:-1}
.tab button.pop svg{animation:pop .35s}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg2);padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:95;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ---- mascot ---- */
.tarpi{width:64px;height:64px;flex:none;overflow:visible}
.tarpi .eyes{transform-origin:60px 68px;animation:blink 4.2s infinite}
.tarpi.happy .tbd,.tarpi.wow .tbd{animation:hop .5s ease-in-out infinite alternate;transform-origin:60px 100px}
.tarpi.sad .tbd{animation:sway 2s ease-in-out infinite;transform-origin:60px 100px}
.tarpi.hungry .tbd{animation:wobble 2.4s ease-in-out infinite;transform-origin:60px 100px}
.tarpi.big{width:120px;height:120px}
.mrow{display:flex;align-items:center;gap:10px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font:700 14px/1.3 Outfit,system-ui,sans-serif;color:var(--ink)}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble.up::before{left:50%;top:-8px;transform:translateX(-50%) rotate(135deg)}
/* ---- overlay ---- */
.ov{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 38%,var(--ov1),var(--ov2) 80%);color:var(--ovInk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));overflow:hidden}
.ovh{font:800 21px Outfit,system-ui,sans-serif;margin:0;text-align:center}
.ovsub{margin:0;color:var(--mut);min-height:24px;text-align:center;font-size:14px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:7px;border-radius:9px;background:color-mix(in srgb,var(--ovInk) 22%,transparent);transition:.3s}
.dots i.done{background:var(--g)}.dots i.on{background:var(--g);width:38px}
.ovact{display:flex;gap:10px;align-items:center}.ovact .btn{min-width:150px}
.pack{--cut:0;width:min(280px,64vw,calc((100dvh - 230px)*.66));aspect-ratio:3/4.4;border-radius:22px;background:#000;position:relative;overflow:hidden;cursor:grab;display:flex;flex-direction:column;box-shadow:0 22px 60px rgba(0,0,0,.45);animation:bob 2.4s ease-in-out infinite;padding:0;border:0;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.pack .strip{position:absolute;top:0;left:0;right:0;height:12%;z-index:3;background:linear-gradient(90deg,var(--g),var(--gD));clip-path:polygon(0 0,100% 0,100% 70%,95% 100%,90% 70%,85% 100%,80% 70%,75% 100%,70% 70%,65% 100%,60% 70%,55% 100%,50% 70%,45% 100%,40% 70%,35% 100%,30% 70%,25% 100%,20% 70%,15% 100%,10% 70%,5% 100%,0 70%);display:grid;place-items:center;color:var(--onG);font:800 11px Outfit,system-ui,sans-serif;letter-spacing:.2em;transform:rotate(calc(var(--cut)*-8deg)) translateY(calc(var(--cut)*-10px));transform-origin:0 100%}
.pack .cut{position:absolute;top:12%;left:0;height:3px;width:calc(var(--cut)*100%);background:#fff;box-shadow:0 0 12px 3px #fff,0 0 30px 6px var(--g);z-index:4;border-radius:3px}
.pack .bhd{height:26%;place-items:end center;padding-bottom:8px}
.pack .bart::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.4) 48%,transparent 60%);background-size:250% 100%;animation:shine 2.6s linear infinite}
.pack .logo{font-size:30px}
.pack .bttl{font-size:34px}
.pack.open{animation:shake .45s ease-in-out,gone .5s .75s ease-in forwards}
.pack.open .strip{animation:rip .45s ease-in forwards}
.swipearrow{display:flex;align-items:center;gap:6px;font:700 13px Outfit,system-ui,sans-serif;color:var(--mut)}
.swipearrow i{display:inline-block;animation:nudge 1.2s ease-in-out infinite;font-style:normal}
.fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.fx .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0,var(--c) 20%,transparent 64%);opacity:0;animation:flash 1.3s .3s forwards}
.fx .streak{position:absolute;top:18%;left:-70%;width:70%;height:6px;border-radius:9px;background:linear-gradient(90deg,transparent,var(--c),#fff);box-shadow:0 0 26px 8px var(--c);transform:rotate(20deg);animation:streak .7s ease-in forwards}
.flip{width:min(280px,64vw,calc((100dvh - 250px)*.68));aspect-ratio:3/4.3;perspective:1200px;cursor:pointer;position:relative;border:0;background:none;padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
.flip:not(.on){animation:bob 2.2s ease-in-out infinite}
.flip.out{animation:outL .3s ease-in forwards}
.flip .in{position:absolute;inset:0;transition:transform .8s cubic-bezier(.2,.8,.25,1.15);transform-style:preserve-3d;z-index:1}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,#000 0 14px,#06200f 14px 28px);border:3px solid var(--g);display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.back .logo{font-size:30px}
.front{transform:rotateY(180deg);background:#000;display:flex;flex-direction:column;color:#fff;transition:box-shadow .5s .4s}
.flip.on .front{box-shadow:0 0 0 3px var(--c),0 0 70px 12px color-mix(in srgb,var(--c) 65%,transparent)}
.fhd{height:15%;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font:800 18px Outfit,system-ui,sans-serif}
.stars{color:var(--c);font-size:18px;letter-spacing:1px}
.stars span{display:inline-block;opacity:0}
.flip.on .stars span{animation:pop .4s both;animation-delay:calc(.7s + var(--i)*.14s)}
.fart{flex:1;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 80%,#fff),color-mix(in srgb,var(--c) 50%,#000) 78%);padding-bottom:22%}
.big{font-size:92px;line-height:1;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
img.big{width:62%;aspect-ratio:1;object-fit:contain}
.fname{position:absolute;bottom:0;left:0;right:0;padding:44px 14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.8));text-align:center;display:grid;gap:4px}
.fname b{font:800 24px/1 Outfit,system-ui,sans-serif;text-transform:uppercase;text-wrap:balance}
.fname small{font-size:13.5px;opacity:.85}
.rS .front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);background-size:260% 100%;background-position:120% 0;pointer-events:none}
.rS.on .front::after{animation:shine 1.6s 1s ease-out}
.rays{position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--c) 50%,transparent) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);opacity:0;transition:opacity .7s .5s;animation:spin 16s linear infinite;z-index:0;pointer-events:none}
.flip.on .rays{opacity:1}
.pt{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:burst 1.1s ease-out both;z-index:2;pointer-events:none}
.ask{display:grid;justify-items:center;gap:6px;text-align:center;background:var(--ovRow);border:2px solid var(--g);border-radius:24px;padding:22px 20px;width:min(340px,100%);animation:rise .4s both}
.ask h2{font-size:28px;margin:6px 0 0}
.ask p{margin:0 0 12px;color:var(--mut)}
.askb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.recap,.rew{width:min(420px,100%);max-height:100%;overflow:auto;display:grid;gap:8px;padding:4px}
.recap h2,.rew h2{font-size:30px;text-align:center;margin:0}
.rr{display:flex;align-items:center;gap:12px;background:var(--ovRow);border-radius:16px;padding:8px;animation:rise .5s both;animation-delay:calc(var(--i)*.12s)}
.rtot{display:flex;justify-content:space-between;font:800 20px Outfit,system-ui,sans-serif;padding:8px 6px;border-top:3px solid var(--g);margin-top:4px}
.rp{text-align:center;color:var(--mut);font-size:13.5px;margin:0}
.rbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.rew{justify-items:center;text-align:center}
.xpc{font:900 52px/1 Outfit,system-ui,sans-serif;color:#ff9a1f;text-shadow:0 4px 0 #c46a00;font-variant-numeric:tabular-nums}
.rew .xpline{width:100%}
.ritem{width:100%;display:flex;align-items:center;gap:12px;background:var(--ovRow);border:2px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;animation:rise .45s both}
.ritem .e{font-size:28px}
.ritem b{display:block}
.ritem small{color:var(--mut)}
.ritem em{margin-left:auto;font-style:normal;font-weight:800;color:#ff9a1f;white-space:nowrap}
.lvup{font:900 34px/1 Outfit,system-ui,sans-serif;color:var(--gInk);animation:pop .6s both}
#confetti{position:fixed;inset:0;z-index:99;pointer-events:none}
/* ---- keyframes ---- */
@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{opacity:.55;transform:scale(.93)}}
@keyframes orb{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes shake{20%,60%{transform:rotate(-3deg) scale(1.04)}40%,80%{transform:rotate(3deg) scale(1.04)}}
@keyframes gone{to{transform:scale(1.5);opacity:0;filter:brightness(3)}}
@keyframes rip{to{transform:translate(60px,-140px) rotate(28deg);opacity:0}}
@keyframes flash{15%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
@keyframes streak{to{left:110%;top:60%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.35)}100%{opacity:1;transform:scale(1)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(0);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes up{from{transform:translate(-50%,100%)}}
@keyframes fade{from{opacity:0}}
@keyframes twinkle{50%{opacity:.4}}
@keyframes drift{to{transform:translateX(24px)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{to{transform:translateY(-8px) scaleY(1.04)}}
@keyframes sway{50%{transform:rotate(-5deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes nudge{50%{transform:translateX(8px)}}
@keyframes enterL{from{transform:translateX(-60px) rotate(-6deg);opacity:0}}
@keyframes enterR{from{transform:translateX(60px) rotate(6deg);opacity:0}}
@keyframes outL{to{transform:translateX(-120%) rotate(-14deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:380px){.prow{grid-template-columns:46px minmax(0,1fr) 58px 58px}.rate{grid-template-columns:minmax(0,1fr) 70px 56px}.mini{font-size:18px}}
@media (max-height:700px){.hero{--ch:clamp(250px,calc(100dvh - 420px),470px)}.swh{display:none}}
</style>
</head>

  <header class="top">
    <div class="mini" id="brand">TARPAING<br>FAIM</div>
    <button class="me" data-act="profile" id="me"><div class="avr" id="avr"><div class="av" id="av"></div></div><small id="lvl"></small></button>
    <div class="tb"><button class="streak" data-act="profile" id="stk"><span class="fl">🔥</span><b id="stkn">0</b></button><button class="cb" data-act="theme" id="bTheme"></button></div>
  </header>
  <main id="view"></main>
</div>

  <button data-act="tab" data-v="home"></button>
  <button data-act="tab" data-v="cat"></button>
  <button data-act="tab" data-v="explore"></button>
  <button data-act="tab" data-v="hist"></button>

  dmode:b=>{syncDraft();const v=b.dataset.v,ms=draft.modes;if(ms.includes(v)){if(ms.length>1)ms.splice(ms.indexOf(v),1);else toast(t('t_keep1'))}else ms.push(v);sheet(itemForm())},
  demo:b=>{syncDraft();draft.emoji=b.dataset.v;draft.img=null;sheet(itemForm())},
  noimg:()=>{syncDraft();draft.img=null;sheet(itemForm())},
  saveitem:()=>{syncDraft();const d=draft;d.name=d.name.trim();if(!d.name){toast(t('t_name'));$('#fName').focus();return}
    d.price=d.price===''||d.price==null?'':Math.max(0,+String(d.price).replace(',','.')||0);d.emoji=d.emoji||'🍽️';d.modes=MO.filter(m=>d.modes.includes(m));
    const p=S.places.find(x=>x.id==d.placeId),added=p?d.modes.filter(m=>!inMode(p,m)):[];if(p&&added.length)p.modes=MO.filter(m=>inMode(p,m)||added.includes(m));
    if(d.id){const i=S.items.findIndex(x=>x.id==d.id);d.ex=false;d.ia=false;S.items[i]=d}else S.items.push({...d,id:uid(),ex:false});
    save();closeSheet();render();SFX.yes();toast(added.length?t('t_padded',{p:p.name,m:added.map(mL).join(', ')}):t('t_saved'))},
  addplace:()=>{S.places.push({id:uid(),name:t('new_place'),emoji:'📍',rank:'A',weight:10,modes:[curMode()]});save();render()},
  pmode:b=>{const p=S.places.find(x=>x.id==b.dataset.id);if(!p)return;const v=b.dataset.v,ms=MO.filter(m=>inMode(p,m));p.modes=ms.includes(v)?ms.filter(m=>m!=v):MO.filter(m=>ms.includes(m)||m==v);SFX.soft();save();render()},
  delplace:b=>{const id=b.dataset.id;if(pendDel!=id){armDel(id);render();const n=S.items.filter(i=>i.placeId==id).length;if(n)toast(t('t_delplace',{n}));return}S.places=S.places.filter(p=>p.id!=id);S.items=S.items.filter(i=>i.placeId!=id);if(catFilter==id)catFilter='all';pendDel=null;save();render()},
  noav:()=>{S.settings.avatarImg=null;save();render()},
  export:()=>{const x=JSON.stringify(S);const ta=$('#imp');ta.value=x;ta.select();try{navigator.clipboard.writeText(x).then(()=>toast(t('t_copied')),()=>toast(t('t_copyfail')))}catch(e){toast(t('t_copyfail'))}},
  exportfile:()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`tarpaing-faim-${dayKey()}.json`;document.body.appendChild(a);a.click();a.remove();toast(t('t_dl'))}catch(e){toast(t('t_dlfail'))}},
  import:()=>{const x=$('#imp').value.trim();if(!x)return toast(t('t_paste'));doImport(x)},
  clearex:()=>{S.items=S.items.filter(i=>!i.ex);save();render();toast(t('t_exrem'))},
  clearhist:()=>{S.history=[];S.pity=newPity();save();render();toast(t('t_histcl'))},
  reset:()=>{if(!pendReset){pendReset=true;render();setTimeout(()=>{pendReset=false;if(view=='set')render()},3500);return}pendReset=false;S=seed();setLang();save(true);applyTheme();view='home';modeOver=null;render();toast(t('t_reset'))},
  share:async b=>{const h=S.history.find(x=>x.id==b.dataset.id);if(!h)return;SFX.tap();toast(t('t_making'));
    const blob=await makeImg(h);if(!blob)return toast(t('t_imgfail'));if(shareUrl)URL.revokeObjectURL(shareUrl);shareBlob=blob;shareUrl=URL.createObjectURL(blob);shareName=`tarpaing-faim-${h.mode||'midi'}-${dayKey(new Date(h.t))}.jpg`;
    S.game.stats.shares++;const q=qProgress('q_share');const a=checkAch();save();if(q.length||a.length){SFX.quest();toast(q.length?t('q_done')+' +'+q[0].xp+' XP':t('new_ach')+' : '+t(a[0].id));hdr()}
    sheet(`<h2>${t('sh_title')}</h2><img class="shimg" src="${shareUrl}" alt="" style="width:100%;border-radius:16px;display:block;margin:4px 0 10px"><p class="hint2">${t('sh_hint')}</p><div class="sact"><button class="btn ghost sm" data-act="close">${t('close')}</button><button class="btn sm" data-act="savejpg">${I.share} ${t('sh_save')}</button></div>`)},
  savejpg:async()=>{if(!shareBlob)return;let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(!dl){const file=new File([shareBlob],shareName,{type:'image/jpeg'});
      try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Tarpaing Faim'});SFX.yes();return}}catch(e){if(e&&e.name=='AbortError')return}
      try{const a=document.createElement('a');a.href=shareUrl;a.download=shareName;document.body.appendChild(a);a.click();a.remove();toast(t('t_imgdl'));return}catch(e){}
      return toast(t('t_long'))}
    try{await dl.save({filename:shareName,data:shareBlob});toast(t('t_imgsaved'));SFX.yes()}catch(err){const k=err&&err.code;toast(k=='declined'?t('t_savecancel'):k=='rate_limited'?t('t_busy'):t('t_long'))}},
  testsfx:()=>{SFX.tear('S');setTimeout(()=>SFX.reveal('S'),1400);setTimeout(()=>confetti(100),1800)},
  bstep:b=>{SFX.soft();const B=S.settings.budgets,m=curMode(),d=+b.dataset.v;if(B[m]==null)B[m]=d<0?10:15;else B[m]=Math.max(1,Math.round((B[m]+d*.5)*2)/2);save();render()},
  bset:b=>{SFX.soft();S.settings.budgets[curMode()]=b.dataset.v===''?null:+b.dataset.v;save();closeSheet();render()},
  bcustom:()=>{const v=+String($('#bCustom').value).replace(',','.');S.settings.budgets[curMode()]=v>0?Math.round(v*2)/2:null;save();closeSheet();render();SFX.yes()},
  xscan:b=>runScan(b.dataset.v=='r'),
  xstop:()=>{if(scan.ctl)scan.ctl.abort()},
  xrad:b=>{S.settings.explore.radius=+b.dataset.v;save();SFX.soft();render()},
  xmode:b=>{S.settings.explore.mode=b.dataset.v;save();SFX.soft();render()},
  xgeo:()=>{if(!navigator.geolocation)return toast(t('t_gpsno'));toast(t('t_gpsgo'));
    navigator.geolocation.getCurrentPosition(p=>{const x=S.settings.explore,la=p.coords.latitude.toFixed(5),lo=p.coords.longitude.toFixed(5);x.coords=[la,lo];x.origin=`${t('my_pos')} (${la}, ${lo})`;save();render();toast(t('t_gpsok'))},()=>toast(t('t_gpserr')),{enableHighAccuracy:true,timeout:10000})},
  xadd:b=>{const r=S.settings.explore.last,p=r&&r.list[+b.dataset.v];if(!p)return;const id=uid(),m=r.mode;
    S.places.push({id,name:p.name,emoji:p.emoji,rank:p.rank,weight:{B:30,A:15,S:5}[p.rank],modes:[m],ia:true});
    p.items.forEach(i=>S.items.push({id:uid(),placeId:id,cat:i.cat,rank:i.rank,emoji:i.emoji,name:i.name,price:i.price||'',img:null,ex:false,ia:true,modes:[m]}));
    S.game.stats.explore++;const a=checkAch();save();SFX.yes();render();toast(a.length?t('new_ach')+' : '+t(a[0].id):t('t_xadded',{p:p.name,n:p.items.length}))},
  next:()=>{SFX.tap();goNext()},
  skip:()=>{SFX.soft();seq.i=seq.steps.length-1;ovRender()},
  ask:b=>{b.dataset.v=='1'?SFX.yes():SFX.soft();const k=seq.steps[seq.i].slice(4);if(b.dataset.v=='1'){const it=pickSlot(seq.e.place.id,k,'B',remOf(seq.e),seq.e.mode);seq.e.slots[k]=snap(it);if(it)bump(it.rank,seq.e.mode);save();seq.steps.splice(seq.i+1,0,k)}seq.i++;ovRender()},
  closeov:()=>{SFX.tap();const r=reward(seq.e);if(r){rewardScreen(r)}else A.rewclose()},
  rewclose:()=>{ov.hidden=true;ov.innerHTML='';document.body.style.overflow='';seq=null;view='home';render();scrollTo(0,0)}
};
let suppress=0;
document.addEventListener('click',e=>{
  if(Date.now()<suppress){e.preventDefault();e.stopPropagation();return}
  if(e.target===sh){closeSheet();return}
  const p=e.target.closest('#pack');if(p){tear(p);return}
  const f=e.target.closest('#flip');if(f){flipCard(f);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(['del','rates','bsheet'].includes(b.dataset.act))e.stopPropagation();
  const fn=A[b.dataset.act];if(fn)fn(b,e);
},true);
/* ---------- Swipe ---------- */
let drag=null,tiltRAF=0;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('#pack,#flip,#bst');if(!el||e.button>0)return;if(e.target.closest('.tchip'))return;drag={el,x:e.clientX,y:e.clientY,moved:false,ripLast:0};try{el.setPointerCapture(e.pointerId)}catch(_){}if(el.id=='bst')el.classList.add('drag')});
document.addEventListener('pointermove',e=>{
  if(!drag){const b=e.pointerType=='mouse'&&e.target.closest&&e.target.closest('#bst');if(!b||reduce||tiltRAF)return;tiltRAF=requestAnimationFrame(()=>{tiltRAF=0;const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;b.style.setProperty('--ry',(x-.5)*14+'deg');b.style.setProperty('--rx',(.5-y)*14+'deg');b.style.setProperty('--fx',x*100+'%');b.style.setProperty('--fy',y*100+'%')});return}
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;const el=drag.el;
  if(el.id=='bst'){el.style.setProperty('--sx',dx*.6+'px');el.style.setProperty('--sy',Math.min(0,dy)*.6+'px');el.style.setProperty('--fx',50+dx/4+'%')}
  else if(el.id=='pack'&&!el.classList.contains('open')){const p=Math.max(0,Math.min(1,Math.max(Math.abs(dx),-dy)/(el.offsetWidth*.85)));el.style.setProperty('--cut',p.toFixed(3));if(p-drag.ripLast>.08){drag.ripLast=p;SFX.rip(p);vib(5)}if(p>=1){suppress=Date.now()+400;drag=null;tear(el)}}
  else if(el.id=='flip'){el.style.transform=`translateX(${dx*.5}px) rotate(${dx*.03}deg)`}
});
function endDrag(e){if(!drag)return;const d=drag;drag=null;const dx=e.clientX-d.x,dy=e.clientY-d.y,el=d.el;
  if(d.moved)suppress=Date.now()+350;
  if(el.id=='bst'){el.classList.remove('drag');el.style.setProperty('--sx','0px');el.style.setProperty('--sy','0px');if(!d.moved)return;
    if(dy<-70&&Math.abs(dy)>Math.abs(dx)){SFX.swipe();openBooster()}else if(Math.abs(dx)>70)switchMode(dx<0?1:-1)}
  else if(el.id=='pack'){if(el.classList.contains('open'))return;const p=+getComputedStyle(el).getPropertyValue('--cut')||0;if(p>.55)tear(el);else el.style.setProperty('--cut',0)}
  else if(el.id=='flip'){el.style.transform='';if(!d.moved)return;if(dx<-60||dy<-60){if(el.classList.contains('on')){const nx=$('#nx');if(nx&&!nx.disabled)goNext()}else flipCard(el)}}}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('pointerout',e=>{const b=e.target.closest&&e.target.closest('#bst');if(b&&!drag&&!b.contains(e.relatedTarget)){b.style.setProperty('--rx','0deg');b.style.setProperty('--ry','0deg')}});
document.addEventListener('input',e=>{
  if(e.target.id=='fEmo'&&draft&&!draft.img){$('#pv').innerHTML=icon(e.target.value,null);return}
  const f=e.target.dataset.f;if(!f)return;const v=e.target.value,s=S.settings;
  if(f=='sound'||f=='vibe')s[f]=e.target.checked;else if(f=='volume')s.volume=+v;else if(f=='pseudo')s.pseudo=v;else if(f=='avatar')s.avatar=v||'😋';
  else if(f.startsWith('hour:')){if(v){s.hours[f.slice(5)]=v;applyTheme()}}
  else if(f.startsWith('x:')){s.explore[f.slice(2)]=v;if(f=='x:origin')delete s.explore.coords}
  else if(f.startsWith('rate:'))s.rates[f.slice(5)]=Math.max(0,+v||0);
  else if(f=='pityA'||f=='pityS'){if(v!=='')s[f]=Math.max(1,Math.round(+v||1))}
  else if(f.startsWith('p:')){const [,id,k]=f.split(':');const pl=S.places.find(x=>x.id==id);if(pl)pl[k]=k=='weight'?Math.max(0,+v||0):v}
  save();updPct();hdr();
});
document.addEventListener('change',async e=>{const tg=e.target,file=tg.files&&tg.files[0];if(!file)return;
  try{if(tg.id=='fImg'){syncDraft();draft.img=await resize(file,200);sheet(itemForm())}
    else if(tg.id=='fAv'){S.settings.avatarImg=await resize(file,160);save();render()}
    else if(tg.id=='fImp'){doImport(await file.text())}}catch(err){toast(t('t_file'))}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!sh.hidden)closeSheet()});
document.querySelectorAll('#tab button').forEach((b,j)=>b.innerHTML=[I.home,I.cards,I.compass,I.cal,I.gear][j]);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
/* ---------- Boucle légère ---------- */
let pj=0,lastAuto=autoMode();
setInterval(()=>{
  if(document.hidden)return;
  const a=autoMode();if(a!=lastAuto){lastAuto=a;applyTheme();if(view=='home'&&!seq&&sh.hidden){if(modeOver==a)modeOver=null;render()}}
  if(reduce||view!='home'||seq)return;const pl=$('#plate');if(!pl)return;const e=emojisOf(curMode());if(e.length<2)return;const sp=pl.firstElementChild;sp.classList.add('out');setTimeout(()=>{pj=(pj+1)%e.length;sp.textContent=e[pj];sp.classList.remove('out')},350)},2200);
document.addEventListener('visibilitychange',()=>{root.classList.toggle('paused',document.hidden);if(!document.hidden&&view=='home'&&!seq&&sh.hidden)render()});
if('serviceWorker' in navigator&&window.top===window&&location.protocol==='https:'&&document.querySelector('link[rel=manifest]'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyTheme();render();
}
</script>
